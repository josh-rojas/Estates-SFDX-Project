# Happy Path Scenario - Final Grant
# BRD Section 3.1: Phase 1-5 Complete Lifecycle
# Responsive successor, chooses Final Grant pathway, standard 65-day timeline

# ==================== MACROS ====================

- macro: PersonAccountRecordType
  value: PersonAccount

- macro: BusinessAccountRecordType
  value: IndustriesBusiness

- macro: EstateAdministrationRecordType
  value: EstateAdministration

- macro: ClientAssociateTaskRecordType
  value: ClientAssociateTask

# ==================== DECEASED DONOR ====================

- object: Account
  nickname: DeceasedDonor_Margaret
  fields:
    RecordType.DeveloperName: ${{PersonAccountRecordType}}
    FirstName: Margaret
    LastName: Thompson
    Salutation: Mrs.
    PersonBirthdate: 1945-06-15
    Type: Donor
    Deceased__c: true
    Date_of_Death__c:
      date_between:
        start_date: -30d
        end_date: -30d
    PersonEmail: margaret.thompson@legacy-estate.example.com
    PersonMobilePhone: (555) 000-1001
    PersonHomePhone: (555) 001-1001
    PersonMailingStreet: 123 Estate Lane, Pacific Heights
    PersonMailingCity: San Francisco
    PersonMailingState: CA
    PersonMailingPostalCode: 94102
    PersonMailingCountry: United States
    FinServ__ClientCategory__c: Platinum
    FinServ__NetWorth__c: 5000000
    FinServ__Status__c: Closed
    FinServ__InvestmentObjectives__c: Conservative Income;Income
    FinServ__RiskTolerance__c: Conservative
    DAF_Accounts__c: 1
    Self_Qualified_Premier__c: true
    Description: "Margaret Elizabeth Thompson, age 78, passed away peacefully on [Date of Death]. Long-time Schwab Charitable client since 1998. Estate includes substantial DAF holdings with 15+ year history of grants to arts and education organizations. Primary successor is daughter Jennifer Marie Thompson, a museum curator in Los Angeles. Estate planning completed in 2022 with comprehensive succession designations. Personal note: Margaret was a passionate supporter of arts education and environmental conservation."

# ==================== LIVING SUCCESSOR ====================

- object: Account
  nickname: Successor_Jennifer
  fields:
    RecordType.DeveloperName: ${{PersonAccountRecordType}}
    FirstName: Jennifer
    LastName: Thompson
    Salutation: Ms.
    PersonBirthdate: 1975-03-20
    Type: Prospect
    Deceased__c: false
    PersonEmail: jennifer.thompson@email.example.com
    PersonMobilePhone: (555) 100-2001
    PersonHomePhone: (213) 555-3001
    PersonMailingStreet: 456 Successor Avenue, Arts District
    PersonMailingCity: Los Angeles
    PersonMailingState: CA
    PersonMailingPostalCode: 90001
    PersonMailingCountry: United States
    FinServ__ClientCategory__c: Gold
    FinServ__NetWorth__c: 750000
    FinServ__Status__c: Active
    FinServ__InvestmentObjectives__c: Growth;Income
    FinServ__RiskTolerance__c: Moderate
    Description: "Jennifer Marie Thompson, age 49, Senior Curator of Modern Art at Los Angeles County Museum of Art (LACMA). Mother Margaret Thompson's designated successor for DAF holdings. Jennifer has been actively involved in philanthropic activities alongside her mother, particularly in arts education and environmental conservation. Responded promptly to succession notification and selected Final Grant pathway to Bay Area Arts Collective. Contact established on first attempt, form completed within 48 hours."
    Area_of_Interest__c: Family Philanthropy / Legacy Planning
    PersonHasOptedOutOfEmail: false
    PersonDoNotCall: false

# ==================== ADVISOR FIRM ====================

- object: Account
  nickname: AdvisorFirm_Pacific
  fields:
    RecordType.DeveloperName: ${{BusinessAccountRecordType}}
    Name: Pacific Heritage Group
    Type: Advisor
    Phone: (555) 200-3001
    BillingStreet: 789 Financial Plaza, Suite 1800
    BillingCity: San Francisco
    BillingState: CA
    BillingPostalCode: 94105
    BillingCountry: United States
    Description: "Established wealth management firm specializing in high-net-worth clients and charitable giving strategies. Has served the Thompson family since 2010, providing comprehensive wealth management and DAF advisory services. Partnered with Schwab Charitable to establish and manage the Thompson Family DAF. Known for their expertise in multi-generational wealth transfer and succession planning."
    AS_Segment__c: Star
    AS_Region__c: SO. CALIFORNIA
    FinServ__Status__c: Active

# ==================== FINANCIAL ACCOUNT ====================

- object: FinancialAccount
  nickname: DAF_Thompson
  fields:
    Name: Thompson Family Fund
    FinancialAccountNumber:
      fake.Numerify:
        text: DAF-########
    FinancialAccountType: DAF/Donor Advised Fund
    Program: ASDAF
    Status: Active
    Balance: 2500000
    BalanceAsOf:
      date_between:
        start_date: -2d
        end_date: -2d
    OpenDate:
      date_between:
        start_date: -5y
        end_date: -5y
    FirstContributionDate: ${{OpenDate}}
    MostRecentGrantDate:
      date_between:
        start_date: -90d
        end_date: -90d
    ArtsCultureLifetime: 50000
    EducationLifetime: 75000
    HealthLifetime: 37500
    HumanServicesLifetime: 50000
    ReligionLifetime: 25000
    EnvironmentalLifetime: 12500
    Ownership: Individual
    SeparatelyManagedAccount: false
    LegacyAccount: false
    BeneficiaryAccount: false
  friends:
    - object: Account
      nickname: DeceasedDonor_Margaret

# ==================== FINANCIAL ACCOUNT ROLES ====================

- object: FinancialAccountRole
  nickname: Role_PrimaryOwner
  fields:
    Role: Primary Owner
    Active: true
    StartDate:
      date_between:
        start_date: -5y
        end_date: -5y
  friends:
    - object: FinancialAccount
      nickname: DAF_Thompson
    - object: Account
      nickname: DeceasedDonor_Margaret

- object: FinancialAccountRole
  nickname: Role_Successor
  fields:
    Role: Successor
    Active: true
    StartDate:
      date_between:
        start_date: -5y
        end_date: -5y
    SuccessorAllocation: 100
  friends:
    - object: FinancialAccount
      nickname: DAF_Thompson
    - object: Account
      nickname: Successor_Jennifer

- object: FinancialAccountRole
  nickname: Role_Advisor
  fields:
    Role: Advisor
    Active: true
    StartDate:
      date_between:
        start_date: -5y
        end_date: -5y
  friends:
    - object: FinancialAccount
      nickname: DAF_Thompson
    - object: Account
      nickname: AdvisorFirm_Pacific

# ==================== SUCCESSION CASE ====================

- object: Case
  nickname: Case_Thompson_HappyPath
  fields:
    RecordType.DeveloperName: ${{EstateAdministrationRecordType}}
    Type: Named Successor Enactment
    Subject: Succession - Thompson Estate
    Status: In Progress
    Priority: Medium
    Origin: Phone
    VerificationStatus: Complete - Verified
    ContactAttemptCount: 1
    ContactEstablished: true
    ContactEstablishedDate:
      date_between:
        start_date: -7d
        end_date: -7d
    PathwayConfirmed: Final Grant
    FormSentDate:
      date_between:
        start_date: -5d
        end_date: -5d
    FormCompletedDate:
      date_between:
        start_date: -3d
        end_date: -3d
    Execution_Status__c: Completed
    New_DAF_Account_Number__c: null
    Charity_Account__c: Charity_RegionalArts.Id
    Charity_Contact__c: Contact_CharityArts.Id
    NotificationSource: Financial Advisor
    Description: "Happy path succession case - Margaret Thompson estate with $3.5M DAF. Jennifer Thompson (successor) contacted on first attempt, responded promptly to email invitation, completed online form within 48 hours selecting Final Grant pathway to Bay Area Arts Collective ($3.5M grant). All documentation processed efficiently, funds disbursed successfully. Case demonstrates optimal workflow with responsive successor and clear pathway selection."
    IsEscalated: false
  friends:
    - object: Account
      nickname: DeceasedDonor_Margaret
    - object: FinancialAccount
      nickname: DAF_Thompson

# ==================== PHASE 3-5 TASKS ====================

# Phase 3: Form Follow-up
- object: Task
  fields:
    Subject: Follow-up on Submitted Form
    Status: Completed
    Type: Email
    ActivityDate:
      date_between:
        start_date: -4d
        end_date: -4d
    Description: "Acknowledged receipt of completed succession form via email. Jennifer Thompson confirmed Final Grant pathway selection. Contacted Bay Area Arts Collective Development Director (Sarah Chen) to verify grant acceptance procedures and confirm EIN validation. Grant amount: $3.5M. Requested grant agreement template and tax documentation requirements."
  friends:
    - object: Case
      nickname: Case_Thompson_HappyPath

# Phase 4: Grant Coordination
- object: Task
  fields:
    Subject: Contact Charity for Grant Acceptance
    Status: Completed
    Type: Call
    ActivityDate:
      date_between:
        start_date: -2d
        end_date: -2d
    Description: "Confirmed Bay Area Arts Collective can accept $3.5M grant amount. Spoke with Development Director Sarah Chen to review grant acceptance procedures. Provided secure wire transfer instructions and confirmed EIN verification (12-3456789). Grant scheduled for disbursement within 5 business days. Charity confirmed they can utilize funds for general operating support as intended by successor Jennifer Thompson."
  friends:
    - object: Case
      nickname: Case_Thompson_HappyPath

# Phase 5: Final Settlement
- object: Task
  fields:
    Subject: Process Final Grant Distribution
    Status: Completed
    Type: Other
    ActivityDate:
      date_between:
        start_date: -1d
        end_date: -1d
    Description: "Final grant of $3.5M disbursed to Bay Area Arts Collective via wire transfer. Bank confirmation received and verified. DAF account officially closed per BRD Phase 5 requirements. Successor Jennifer Thompson notified via email of completion with tax receipt attached. Case ready for final closure - all succession requirements fulfilled successfully."
  friends:
    - object: Case
      nickname: Case_Thompson_HappyPath

# ==================== FUTURE EVENTS ====================

# Future review meeting
- object: Event
  fields:
    Subject: 30-Day Post-Closure Follow-up
    StartDateTime:
      date_between:
        start_date: +30d
        end_date: +30d
    DurationInMinutes: 30
    Location: Virtual - Zoom
    Type: Meeting, Client
    ShowAs: Busy
    Description: "30-day post-closure follow-up meeting with Jennifer Thompson to ensure satisfaction with the succession and grant distribution process. Review tax implications of the $3.5M grant to Bay Area Arts Collective. Discuss future philanthropic opportunities and potential establishment of new DAF account if desired. Evaluate overall experience with Schwab Charitable succession process."
  friends:
    - object: Case
      nickname: Case_Thompson_HappyPath

# ==================== MILESTONE CHATTER POSTS ====================

# Phase 1: Case Creation
- object: FeedItem
  fields:
    Type: TextPost
    Body: "Case opened following notification from Pacific Heritage Group. Death certificate and estate documents received and verified. Beginning Phase 1 verification per BRD. Legacy account shows 15+ year history with $8.5M in total grants across arts and education sectors. Successor identified: Jennifer Thompson, LACMA curator."
    Visibility: InternalUsers
  friends:
    - object: Case
      nickname: Case_Thompson_HappyPath

# Phase 2: Contact Established
- object: FeedItem
  fields:
    Type: TextPost
    Body: "@Estates_Manager Contact established with Jennifer Thompson on first attempt (Day 0). Discussed three pathway options: Final Grant, New DAF, Disclaim Assets. Successor requested time to consult with family. Succession form sent with secure link. Strong interest in continuing mother's legacy of arts and culture philanthropy - particularly Bay Area Arts Collective."
    Visibility: InternalUsers
  friends:
    - object: Case
      nickname: Case_Thompson_HappyPath

# Phase 3: Form Received
- object: FeedItem
  fields:
    Type: TextPost
    Body: "✅ Succession form received and processed. Pathway selected: Final Grant to Bay Area Arts Collective ($3.5M). Successor Jennifer Thompson confirmed selection within 48 hours. Moving to Phase 4 execution per BRD. Grant represents complete liquidation of DAF account established in 1998."
    Visibility: InternalUsers
  friends:
    - object: Case
      nickname: Case_Thompson_HappyPath

# Phase 4: Execution Progress
- object: FeedItem
  fields:
    Type: TextPost
    Body: "Grant execution in progress. Bay Area Arts Collective Development Director contacted - wire instructions and EIN confirmed. $3.5M funds transfer scheduled for tomorrow. Account shows 15+ year relationship with arts organizations, including 8+ year partnership with Thompson family. Grant will support general operating needs."
    Visibility: InternalUsers
  friends:
    - object: Case
      nickname: Case_Thompson_HappyPath

# Phase 5: Completion
- object: FeedItem
  fields:
    Type: TextPost
    Body: "✅ CASE CLOSED: Grant of $3.5M successfully disbursed to Bay Area Arts Collective. DAF account terminated per BRD requirements. Total case duration: 12 days from notification to closure. Successor Jennifer Thompson confirmed satisfaction via email. Final grant completes 25-year legacy of arts philanthropy for the Thompson family."
    Visibility: InternalUsers
  friends:
    - object: Case
      nickname: Case_Thompson_HappyPath

