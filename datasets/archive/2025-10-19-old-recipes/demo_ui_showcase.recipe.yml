# Demo UI Showcase Recipe
# Purpose: Generate test data demonstrating all UI states for LWC components
# Components: successionContactCadence, caseHierarchyViewer
#
# This recipe creates cases at various stages of the contact cadence to showcase:
# - Attempt 0: No contact yet (Pending state)
# - Attempt 1: First contact completed (Completed state)
# - Attempt 2: Second contact in progress (Current state)
# - Attempt 3: Third contact completed (Completed state)
# - Attempt 4: Fourth contact escalated (Escalated state)
# - Contact Established: All 5 attempts shown as complete
# - Multi-Successor: Parent case with 2 child cases (Case Hierarchy)

# ==================== MACROS ====================

- macro: PersonAccountRecordType
  value: PersonAccount

- macro: BusinessAccountRecordType
  value: IndustriesBusiness

- macro: EstateAdministrationRecordType
  value: EstateAdministration

- macro: ClientAssociateTaskRecordType
  value: ClientAssociateTask

