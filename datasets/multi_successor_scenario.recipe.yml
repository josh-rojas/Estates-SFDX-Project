# Multiple Successors Scenario
# BRD Appendix B: Multiple successor coordination with allocation splits
# Creates parent/child case hierarchy via Case_Multiple_Successors_Handler flow

# ==================== MACROS ====================

- macro: PersonAccountRecordType
  value: PersonAccount

- macro: BusinessAccountRecordType
  value: IndustriesBusiness

- macro: EstateAdministrationRecordType
  value: EstateAdministration

- macro: ClientAssociateTaskRecordType
  value: ClientAssociateTask

