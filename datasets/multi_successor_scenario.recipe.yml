# ==================== FINANCIAL ACCOUNT ====================

- object: FinancialAccount
  nickname: DAF_Williams
  fields:
    Name: Williams Family Foundation Fund
    FinancialAccountNumber:
      fake.Numerify:
        text: DAF-########
    FinancialAccountType: DAF/Donor Advised Fund
    Program: ASDAF
    Status: Active
    Balance: 3500000
    BalanceAsOf:
      date_between:
        start_date: -2d
        end_date: -2d
    OpenDate:
      date_between:
        start_date: -10y
        end_date: -10y
    FirstContributionDate: ${{OpenDate}}
    MostRecentGrantDate:
      date_between:
        start_date: -60d
        end_date: -60d
    ArtsCultureLifetime: 150000
    EducationLifetime: 200000
    HealthLifetime: 100000
    HumanServicesLifetime: 175000
    ReligionLifetime: 75000
    EnvironmentalLifetime: 50000
    Ownership: Individual
    SeparatelyManagedAccount: false
    LegacyAccount: false
    BeneficiaryAccount: false
  friends:
    - object: Account
      nickname: DeceasedDonor_Williams

# ==================== FINANCIAL ACCOUNT ROLES ====================

- object: FinancialAccountRole
  nickname: Role_PrimaryOwner_Williams
  fields:
    Role: Primary Owner
    Active: true
    StartDate:
      date_between:
        start_date: -10y
        end_date: -10y
  friends:
    - object: FinancialAccount
      nickname: DAF_Williams
    - object: Account
      nickname: DeceasedDonor_Williams

# Successor 1: Amanda (50% allocation)
- object: FinancialAccountRole
  nickname: Role_Successor_Amanda
  fields:
    Role: Successor
    Active: true
    StartDate:
      date_between:
        start_date: -10y
        end_date: -10y
    SuccessorAllocation: 50
  friends:
    - object: FinancialAccount
      nickname: DAF_Williams
    - object: Account
      nickname: Successor_Amanda

# Successor 2: Brandon (50% allocation)
- object: FinancialAccountRole
  nickname: Role_Successor_Brandon
  fields:
    Role: Successor
    Active: true
    StartDate:
      date_between:
        start_date: -10y
        end_date: -10y
    SuccessorAllocation: 50
  friends:
    - object: FinancialAccount
      nickname: DAF_Williams
    - object: Account
      nickname: Successor_Brandon

- object: FinancialAccountRole
  nickname: Role_Advisor_Northwest
  fields:
    Role: Advisor
    Active: true
    StartDate:
      date_between:
        start_date: -10y
        end_date: -10y
  friends:
    - object: FinancialAccount
      nickname: DAF_Williams
    - object: Account
      nickname: AdvisorFirm_Northwest

# ==================== INITIAL SUCCESSION CASE ====================
# NOTE: Case_Multiple_Successors_Handler flow will automatically:
# 1. Detect 2 FinancialAccountRoles with Role="Successor"
# 2. Create parent "Multi-Account Succession Master" Case
# 3. Update this Case to be Child 1 (with ParentId)
# 4. Create Child 2 Case for Brandon
# 5. Add both successors as Case Team Members to parent

- object: Case
  nickname: Case_Williams_MultiSuccessor
  fields:
    RecordType.DeveloperName: ${{EstateAdministrationRecordType}}
    Type: Named Successor Enactment
    Subject: Succession - Williams Estate (Multiple Successors)
    Status: In Progress
    Priority: Medium
    Origin: Phone
    VerificationStatus: Complete - Verified
    ContactAttemptCount: 2
    ContactEstablished: true
    ContactEstablishedDate:
      date_between:
        start_date: -10d
        end_date: -10d
    PathwayConfirmed: Final Grant
    FormSentDate:
      date_between:
        start_date: -8d
        end_date: -8d
    FormCompletedDate:
      date_between:
        start_date: -5d
        end_date: -5d
    Execution_Status__c: In Progress
    Asset_Transfer_Status__c: Transfer Initiated
    NotificationSource: Financial Advisor
    Description: "Complex multi-successor coordination scenario demonstrating BRD Appendix B requirements. Parent case oversees two child cases with different pathways: Amanda selected Final Grant ($1.75M to National Education Foundation), Brandon selected New DAF ($1.75M transfer). 50/50 allocation split validated. Parallel processing timelines require careful coordination to ensure both successors' preferences are honored while maintaining compliance."
    IsEscalated: false
  friends:
    - object: Account
      nickname: DeceasedDonor_Williams
    - object: FinancialAccount
      nickname: DAF_Williams

# ==================== CHILD CASES WITH DIFFERENT PATHWAYS ====================

# Child Case 1: Amanda Williams - Final Grant ($1.75M)
- object: Case
  nickname: Case_Amanda_FinalGrant
  fields:
    RecordType.DeveloperName: ${{EstateAdministrationRecordType}}
    Type: Named Successor Enactment
    Subject: Succession - Amanda Williams (50% - Final Grant)
    ParentId: Case_Williams_MultiSuccessor.Id
    Status: In Progress
    Priority: Medium
    Origin: Phone
    VerificationStatus: Complete - Verified
    ContactAttemptCount: 2
    ContactEstablished: true
    ContactEstablishedDate:
      date_between:
        start_date: -10d
        end_date: -10d
    PathwayConfirmed: Final Grant
    FormSentDate:
      date_between:
        start_date: -8d
        end_date: -8d
    FormCompletedDate:
      date_between:
        start_date: -5d
        end_date: -5d
    Execution_Status__c: Completed
    Execution_Completed_Date__c:
      date_between:
        start_date: -2d
        end_date: -2d
    Asset_Transfer_Status__c: Completed
    Grant_Settlement_Status__c: Funds Disbursed
    Charity_Account__c: Charity_NationalEducation.Id
    Charity_Contact__c: Contact_CharityEd.Id
    NotificationSource: Financial Advisor
    Description: "Child case for Amanda Williams - Elder sibling, 50% allocation ($1.75M). Selected Final Grant pathway to National Education Foundation. Amanda is a physician with strong interest in STEM education. Grant will support college scholarships and research programs. Contact established promptly, form submitted within 72 hours. Demonstrates independent successor decision-making within multi-successor framework."
    IsEscalated: false
  friends:
    - object: Account
      nickname: Successor_Amanda

# Child Case 2: Brandon Williams - New DAF ($1.75M)
- object: Case
  nickname: Case_Brandon_NewDAF
  fields:
    RecordType.DeveloperName: ${{EstateAdministrationRecordType}}
    Type: Named Successor Enactment
    Subject: Succession - Brandon Williams (50% - New DAF)
    ParentId: Case_Williams_MultiSuccessor.Id
    Status: In Progress
    Priority: Medium
    Origin: Phone
    VerificationStatus: Complete - Verified
    ContactAttemptCount: 2
    ContactEstablished: true
    ContactEstablishedDate:
      date_between:
        start_date: -10d
        end_date: -10d
    PathwayConfirmed: New DAF Account
    FormSentDate:
      date_between:
        start_date: -8d
        end_date: -8d
    FormCompletedDate:
      date_between:
        start_date: -5d
        end_date: -5d
    Execution_Status__c: Settlement Pending
    Asset_Transfer_Status__c: Transfer Completed
    Grant_Settlement_Status__c: Pending Review
    New_DAF_Account_Number__c:
      fake.Numerify:
        text: DAF-########
    NotificationSource: Financial Advisor
    Description: "Child case for Brandon Williams - Younger sibling, 50% allocation ($1.75M). Selected New DAF pathway to establish Brandon Williams Family Fund. Brandon is an environmental lawyer interested in conservation causes. New DAF account will allow continued philanthropic activity while maintaining tax advantages. Transfer completed successfully, account fully operational. Illustrates New DAF pathway complexity in multi-successor scenarios."
    IsEscalated: false
  friends:
    - object: Account
      nickname: Successor_Brandon

# ==================== CROSS-SIBLING COORDINATION CHATTER ====================

- object: FeedItem
  fields:
    ParentId: Case_Williams_MultiSuccessor.Id
    Type: TextPost
    Body: "📊 Status Update: Amanda completed Final Grant ($1.75M disbursed to National Education Foundation). Brandon's New DAF transfer in progress (est. completion: [Date]). Different pathways create parallel processing timelines."
    Visibility: InternalUsers

- object: FeedItem
  fields:
    ParentId: Case_Williams_MultiSuccessor.Id
    Type: TextPost
    Body: "@[Compliance Team] Multi-successor allocation validation: Amanda (50%) + Brandon (50%) = 100%. Separate charity selections require independent compliance reviews per BRD Appendix B."
    Visibility: InternalUsers

- object: FeedItem
  fields:
    ParentId: Case_Amanda_FinalGrant.Id
    Type: TextPost
    Body: "✅ Amanda's case closed - $1,750,000 grant disbursed to National Education Foundation. 8-year relationship with donor family continues through final grant."
    Visibility: InternalUsers

- object: FeedItem
  fields:
    ParentId: Case_Brandon_NewDAF.Id
    Type: TextPost
    Body: "New DAF account created for Brandon - DAF-[NewAccountNumber]. $1,750,000 transferred. Account setup complete, ready for ongoing grantmaking."
    Visibility: InternalUsers

# ==================== CONTACT ATTEMPT TASKS ====================

# BRD Day 0: Initial Contact (Successful with Amanda)
- object: Task
  nickname: Task_InitialContact_Amanda
  fields:
    RecordType.DeveloperName: ${{ClientAssociateTaskRecordType}}
    Subject: Contact Attempt 1 - Initial Outreach (Amanda Williams)
    Status: Completed
    Priority: Normal
    Type: Call
    TaskSubtype: Call
    ActivityDate:
      date_between:
        start_date: -25d
        end_date: -25d
    ContactAttemptNumber: 1
    SuccessionContactEstablished: false
    CallType: Outbound
    CallDisposition: Spoke with Contact
    CallDurationInSeconds: 480
    Description: BRD Day 0 - Reached Amanda Williams. Explained succession options. Noted there are 2 successors (50/50 split). Coordinating with Brandon.
  friends:
    - object: Case
      nickname: Case_Williams_MultiSuccessor

# BRD Day 5: Follow-up (Both Successors Coordinated)
- object: Task
  nickname: Task_FollowUp_BothSuccessors
  fields:
    RecordType.DeveloperName: ${{ClientAssociateTaskRecordType}}
    Subject: Contact Attempt 2 - Coordination Call (Both Successors)
    Status: Completed
    Priority: Normal
    Type: Call
    TaskSubtype: Call
    ActivityDate:
      date_between:
        start_date: -20d
        end_date: -20d
    ContactAttemptNumber: 2
    SuccessionContactEstablished: true
    CallType: Outbound
    CallDisposition: Spoke with Contact
    CallDurationInSeconds: 600
    Description: BRD Day 5 - Conference call with both Amanda and Brandon Williams. Discussed 50/50 allocation and Final Grant pathway. Both successors in agreement. Contact established.
  friends:
    - object: Case
      nickname: Case_Williams_MultiSuccessor

# Form Sent Task
- object: Task
  nickname: Task_FormSent_MultiSuccessor
  fields:
    RecordType.DeveloperName: ${{ClientAssociateTaskRecordType}}
    Subject: Send Succession Election Forms (2 Successors)
    Status: Completed
    Priority: Normal
    Type: Call
    TaskSubtype: Email
    ActivityDate:
      date_between:
        start_date: -8d
        end_date: -8d
    Description: Succession election forms emailed to both Amanda and Brandon Williams per BRD Phase 2. Each successor receives form for their 50% allocation.
  friends:
    - object: Case
      nickname: Case_Williams_MultiSuccessor

# ==================== CHATTER POSTS ====================

- object: FeedItem
  nickname: Chatter_MultiSuccessorDetected
  fields:
    Type: TextPost
    Body: Multiple successors detected (2) with 50/50 allocation split. Case_Multiple_Successors_Handler flow will create parent case and child cases per BRD Appendix B. Coordinating contact with both Amanda and Brandon Williams.
    Visibility: InternalUsers
  friends:
    - object: Case
      nickname: Case_Williams_MultiSuccessor

- object: FeedItem
  nickname: Chatter_BothSuccessorsContacted
  fields:
    Type: TextPost
    Body: Contact established with both successors via conference call. Amanda and Brandon Williams are in agreement on Final Grant pathway. Forms sent to both successors for their respective 50% allocations per BRD Phase 2.
    Visibility: InternalUsers
  friends:
    - object: Case
      nickname: Case_Williams_MultiSuccessor
