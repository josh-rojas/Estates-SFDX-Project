        start_date: -40d
        end_date: -40d
    PersonEmail: patricia.williams@legacy-estate.example.com
    PersonMobilePhone: (555) 000-3001
    PersonHomePhone: (555) 001-3001
    PersonMailingStreet: 789 Legacy Boulevard
    PersonMailingCity: Seattle
    PersonMailingState: WA
    PersonMailingPostalCode: 98101
    PersonMailingCountry: United States
    FinServ__ClientCategory__c: Platinum
