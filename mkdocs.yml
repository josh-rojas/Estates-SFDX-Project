site_name: Salesforce Project Documentation
site_url: https://sfdx-hardis.cloudity.com
repo_url: https://github.com/hardisgroupco/sfdx-hardis
edit_uri: tree/master/docs
site_author: Nicolas Vuillamy
site_description: Salesforce project documentation generated by sfdx-hardis
copyright: Doc generated by <a href="https://sfdx-hardis.cloudity.com/" target="_blank">sfdx-hardis</a>, provided by <a href="https://cloudity.com/" target="_blank">Cloudity</a>
theme:
  name: material
  icon:
    logo: material/infinity
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.footer
  palette:
    primary: indigo
plugins:
  - search
  - exclude-search:
      exclude:
        - index.md
        - cache-ai-results/*.md
        - '*package.xml.md'
        - package-*items.xml.md
markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
      restrict_base_path: false
  - mdx_truly_sane_lists
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js
  - javascripts/tables.js
  - javascripts/gtag.js
  - javascripts/jstree-handler.js
extra_css:
  - stylesheets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css
  - stylesheets/jstree-custom.css
extra:
  social:
    - icon: fontawesome/regular/circle-question
      link: https://github.com/hardisgroupcom/sfdx-hardis/issues
      name: Need help? Post an issue :)
    - icon: fontawesome/brands/github
      link: https://github.com/hardisgroupcom/sfdx-hardis
    - icon: fontawesome/solid/infinity
      link: https://cloudity.com/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/NicolasVuillamy
  generator: false
nav:
  - Home: index.md
  - Objects:
      All objects: objects/index.md
      Activity: objects/Activity.md
      Case: objects/Case.md
      Task: objects/Task.md
  - Automations:
      - Flows:
          All flows: flows/index.md
          Case_Create_Initial_Contact_Attempt: flows/Case_Create_Initial_Contact_Attempt.md
          Case_Parent_Closure_Handler: flows/Case_Parent_Closure_Handler.md
          Case_Status_Coordination: flows/Case_Status_Coordination.md
          Case_Succession_Segment_Transition: flows/Case_Succession_Segment_Transition.md
          Task_Create_Next_Contact_Attempt: flows/Task_Create_Next_Contact_Attempt.md
          Task_Succession_Contact_Update: flows/Task_Succession_Contact_Update.md
  - Authorizations:
      - Permission Sets:
          All Permission Sets: permissionsets/index.md
          Succession_Field_Access: permissionsets/Succession_Field_Access.md
          Succession_Guest_Access: permissionsets/Succession_Guest_Access.md
          Succession_Management_Access: permissionsets/Succession_Management_Access.md
      - Profiles:
          All Profiles: profiles/index.md
          Service Agent: profiles/Service Agent.md
          Service Supervisor: profiles/Service Supervisor.md
          Service User: profiles/Service User.md
  - Code:
      - Apex:
          All Apex Classes: apex/index.md
          BeginSuccessionProcessingController: apex/BeginSuccessionProcessingController.md
          BeginSuccessionProcessingControllerTest: apex/BeginSuccessionProcessingControllerTest.md
          CaseHierarchyController: apex/CaseHierarchyController.md
          CaseHierarchyController_Test: apex/CaseHierarchyController_Test.md
          ContactCadenceController: apex/ContactCadenceController.md
          ContactCadenceController_Test: apex/ContactCadenceController_Test.md
          CreateSuccessionCaseController: apex/CreateSuccessionCaseController.md
          CreateSuccessionCaseControllerTest: apex/CreateSuccessionCaseControllerTest.md
          SuccessionPublicFormController: apex/SuccessionPublicFormController.md
          SuccessionPublicFormController_Test: apex/SuccessionPublicFormController_Test.md
          SuccessionTaskGenerator: apex/SuccessionTaskGenerator.md
          SuccessionTaskGenerator_Test: apex/SuccessionTaskGenerator_Test.md
      - Lightning Web Components:
          All Lightning Web Components: lwc/index.md
          successionPublicForm: lwc/successionPublicForm.md
          successionContactCadence: lwc/successionContactCadence.md
          successionAccountSummary: lwc/successionAccountSummary.md
          recordPathwaySelection: lwc/recordPathwaySelection.md
          createSuccessionCase: lwc/createSuccessionCase.md
          caseHierarchyViewer: lwc/caseHierarchyViewer.md
          beginSuccessionProcessing: lwc/beginSuccessionProcessing.md
  - Lightning Pages:
      All Lightning pages: pages/index.md
      Succession_Management_Record_Page: pages/Succession_Management_Record_Page.md
  - Packages:
      All Packages: packages/index.md
  - SFDX-Hardis Config: sfdx-hardis-params.md
  - Branches & Orgs: sfdx-hardis-branches-and-orgs.md
  - Manifests:
