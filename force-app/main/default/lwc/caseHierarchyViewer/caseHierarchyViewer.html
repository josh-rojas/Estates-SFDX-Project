<template>
    <lightning-card title="Multi-Successor Case Hierarchy" icon-name="standard:case">
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading hierarchy..." size="small"></lightning-spinner>
        </template>

        <!-- Error Message -->
        <template if:true={error}>
            <div class="slds-m-around_medium">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <h2>Error loading case hierarchy</h2>
                    <p>{error.body.message}</p>
                </div>
            </div>
        </template>

        <!-- No Data Message -->
        <template if:false={hasData}>
            <template if:false={isLoading}>
                <div class="slds-m-around_medium slds-text-color_weak">
                    <p>No child cases found. This component is designed for Multi-Account Succession Master cases with multiple successors.</p>
                </div>
            </template>
        </template>

        <!-- Hierarchy Display -->
        <template if:true={hasData}>
            <div class="slds-card__body slds-card__body_inner">

                <!-- Parent Case Header -->
                <div class="parent-case-header slds-m-bottom_medium">
                    <div class="slds-grid slds-grid_align-spread slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                <lightning-icon icon-name="standard:case" size="small" class="slds-m-right_x-small"></lightning-icon>
                                {parentCaseTitle}
                            </h3>
                            <p class="slds-text-body_small slds-text-color_weak">
                                Status: <strong>{hierarchyData.parentCase.Status}</strong> |
                                Created: <lightning-formatted-date-time value={hierarchyData.parentCase.CreatedDate}></lightning-formatted-date-time>
                            </p>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right">
                            <p class="slds-text-heading_medium">{totalBalance}</p>
                            <p class="slds-text-body_small slds-text-color_weak">Total Account Balance</p>
                        </div>
                    </div>
                </div>

                <div class="slds-border_top slds-m-top_medium slds-p-top_medium">
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                        {childCaseCountText}
                    </p>
                </div>

                <!-- Child Cases -->
                <template for:each={childCasesWithProps} for:item="childData">
                    <div key={childData.caseRecord.Id} class="child-case-section slds-m-bottom_medium">

                        <!-- Child Case Header (Collapsible) -->
                        <div class="child-case-header slds-p-around_medium slds-box"
                             data-case-id={childData.caseRecord.Id}
                             onclick={handleToggleSection}>

                            <div class="slds-grid slds-grid_align-spread slds-wrap">
                                <!-- Left: Case Info -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <template if:true={childData.isExpanded}>
                                                <lightning-icon icon-name="utility:chevrondown" size="x-small"></lightning-icon>
                                            </template>
                                            <template if:false={childData.isExpanded}>
                                                <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
                                            </template>
                                        </div>
                                        <div class="slds-media__body">
                                            <h4 class="slds-text-heading_small">
                                                <a href="#" data-case-id={childData.caseRecord.Id} onclick={navigateToCase}>
                                                    {childData.caseRecord.CaseNumber}
                                                </a>
                                                - {childData.contactName}
                                            </h4>
                                            <div class="slds-m-top_xx-small">
                                                <span class={childData.slaClass}>{childData.caseRecord.SLA_Status__c}</span>
                                                <span class={childData.pathwayClass}>{childData.caseRecord.Pathway_Confirmed__c}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Right: Summary Stats -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right">
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        Contact Attempts: <strong>{childData.caseRecord.Contact_Attempt_Count__c}</strong>
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        Status: <strong>{childData.caseRecord.Status}</strong>
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Expanded Content -->
                        <template if:true={childData.isExpanded}>
                            <div class="expanded-content slds-p-around_medium slds-box slds-box_x-small slds-m-top_x-small">

                                <!-- Contact Information -->
                                <div class="contact-section slds-m-bottom_medium indent-level-1">
                                    <h5 class="slds-text-heading_small slds-m-bottom_small">
                                        <lightning-icon icon-name="standard:contact" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        Successor Contact
                                    </h5>
                                    <div class="slds-grid slds-wrap slds-gutters_small">
                                        <div class="slds-col slds-size_1-of-2">
                                            <p class="slds-text-body_small"><strong>Name:</strong> {childData.contactName}</p>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <p class="slds-text-body_small"><strong>Email:</strong> {childData.contactEmail}</p>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <p class="slds-text-body_small"><strong>Phone:</strong> {childData.contactPhone}</p>
                                        </div>
                                    </div>
                                </div>

                                <!-- Financial Account Information -->
                                <template if:true={childData.financialAccount}>
                                    <div class="account-section slds-m-bottom_medium indent-level-1">
                                        <h5 class="slds-text-heading_small slds-m-bottom_small">
                                            <lightning-icon icon-name="standard:account" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                            Financial Account
                                        </h5>
                                        <div class="slds-box slds-box_x-small slds-p-around_small">
                                            <div class="slds-grid slds-wrap slds-gutters_small">
                                                <div class="slds-col slds-size_1-of-2">
                                                    <p class="slds-text-body_small">
                                                        <strong>Account:</strong>
                                                        <a href="#" data-account-id={childData.financialAccount.Id} onclick={navigateToAccount}>
                                                            {childData.financialAccount.Name}
                                                        </a>
                                                    </p>
                                                </div>
                                                <div class="slds-col slds-size_1-of-2">
                                                    <p class="slds-text-body_small"><strong>Account #:</strong> {childData.accountNumber}</p>
                                                </div>
                                                <div class="slds-col slds-size_1-of-2">
                                                    <p class="slds-text-body_small"><strong>Balance:</strong> {childData.accountBalance}</p>
                                                </div>
                                                <div class="slds-col slds-size_1-of-2">
                                                    <p class="slds-text-body_small"><strong>Status:</strong> {childData.financialAccount.FinServ__Status__c}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </template>

                                <!-- Successors -->
                                <template if:true={childData.hasSuccessors}>
                                    <div class="successors-section indent-level-2">
                                        <h5 class="slds-text-heading_small slds-m-bottom_small">
                                            <lightning-icon icon-name="standard:people" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                            Designated Successors ({childData.successors.length})
                                        </h5>

                                        <template for:each={childData.successorsWithProps} for:item="successor">
                                            <div key={successor.successorName} class="successor-item slds-box slds-box_x-small slds-p-around_small slds-m-bottom_x-small">
                                                <div class="slds-grid slds-wrap slds-gutters_small">
                                                    <div class="slds-col slds-size_1-of-1">
                                                        <p class="slds-text-body_small"><strong>{successor.successorName}</strong></p>
                                                    </div>
                                                    <div class="slds-col slds-size_1-of-3">
                                                        <p class="slds-text-body_small slds-text-color_weak">Allocation: {successor.allocationDisplay}</p>
                                                    </div>
                                                    <div class="slds-col slds-size_1-of-3">
                                                        <p class="slds-text-body_small slds-text-color_weak">Pathway: {successor.pathwayDisplay}</p>
                                                    </div>
                                                    <div class="slds-col slds-size_1-of-3">
                                                        <p class="slds-text-body_small slds-text-color_weak">Status: {successor.status}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                            </div>
                        </template>

                    </div>
                </template>

            </div>
        </template>
    </lightning-card>
</template>
