<template>
  <div class="slds-box">
    <h2 class="slds-text-heading_small slds-m-bottom_medium">
      Select Your Pathway
    </h2>

    <p class="slds-m-bottom_large">
      Choose how you would like to proceed with the donor-advised fund account.
      Click each option to learn more.
    </p>

    <!-- Pathway Cards -->
    <template for:each={pathways} for:item="pathway">
      <div key={pathway.value} class="pathway-card slds-m-bottom_small">
        <!-- Card Header (Clickable) -->
        <div
          class={pathway.value}
          data-pathway={pathway.value}
          onclick={handlePathwaySelect}
          role="button"
          tabindex="0"
          aria-label={pathway.label}
        >
          <div class="slds-grid slds-grid_vertical-align-center">
            <div class="slds-col slds-p-right_small">
              <lightning-input
                type="radio"
                name="pathway"
                value={pathway.value}
                checked={selectedPathway}
                onchange={handlePathwaySelect}
              >
              </lightning-input>
            </div>

            <div class="slds-col slds-has-flexi-truncate">
              <lightning-icon
                icon-name={pathway.icon}
                size="small"
                class="slds-m-right_small"
              >
              </lightning-icon>
              <strong class="pathway-title">{pathway.label}</strong>
              <p
                class="slds-text-color_weak slds-text-body_small slds-m-top_x-small"
              >
                {pathway.description}
              </p>
            </div>

            <div class="slds-col slds-no-flex slds-p-left_small">
              <lightning-button-icon
                icon-name="utility:chevrondown"
                variant="bare"
                alternative-text="Learn more"
                data-pathway={pathway.value}
                onclick={handleToggleSection}
              >
              </lightning-button-icon>
            </div>
          </div>
        </div>

        <!-- Expandable Details Section -->
        <template if:true={pathway.value}>
          <div class="details-section slds-p-around_medium">
            <h4 class="slds-text-heading_x-small slds-m-bottom_small">
              How this works:
            </h4>
            <ul class="slds-list_dotted slds-m-left_large slds-m-bottom_small">
              <template for:each={pathway.details} for:item="detail">
                <li key={detail}>{detail}</li>
              </template>
            </ul>

            <div class="slds-box slds-theme_shade slds-m-top_small">
              <p class="slds-text-body_small">
                <strong>Best for:</strong> {pathway.bestFor}
              </p>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Validation Message -->
    <template if:false={selectedPathway}>
      <div class="slds-box slds-theme_warning slds-m-top_medium">
        <lightning-icon
          icon-name="utility:warning"
          variant="warning"
          size="x-small"
          class="slds-m-right_x-small"
        ></lightning-icon>
        <strong>Please select a pathway to continue</strong>
      </div>
    </template>
  </div>
</template>
