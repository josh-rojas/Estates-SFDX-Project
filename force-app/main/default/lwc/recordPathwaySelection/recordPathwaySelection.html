<template>
  <lightning-card
    title="Record Succession Pathway Selection"
    icon-name="standard:choice"
  >
    <div class="slds-var-p-around_medium">
      <!-- Instructions -->
      <div class="slds-text-body_regular slds-var-m-bottom_medium">
        <p class="slds-var-m-bottom_small">
          <strong>Agent Instructions:</strong> Use this Quick Action to record
          the successor's pathway choice after a verbal conversation. This is
          for simple, straightforward selections only.
        </p>
        <p class="slds-text-color_weak">
          For complex scenarios or paper form processing, use the Screen Flow
          instead.
        </p>
      </div>

      <!-- Pathway Selection Buttons -->
      <div class="slds-var-m-top_medium">
        <p class="slds-text-heading_small slds-var-m-bottom_small">
          Select Succession Pathway:
        </p>

        <div class="slds-grid slds-wrap slds-gutters">
          <!-- Final Grant Button -->
          <div
            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-m-bottom_small"
          >
            <lightning-button
              variant="brand"
              label="Final Grant"
              title="Successor directs account balance as final charitable grant"
              icon-name="utility:gift"
              onclick={handleFinalGrant}
              disabled={isLoading}
              class="slds-size_1-of-1"
            >
            </lightning-button>
          </div>

          <!-- New DAF Account Button -->
          <div
            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-m-bottom_small"
          >
            <lightning-button
              variant="neutral"
              label="New DAF Account"
              title="Successor becomes new donor, account transferred to their name"
              icon-name="utility:switch"
              onclick={handleNewDAF}
              disabled={isLoading}
              class="slds-size_1-of-1"
            >
            </lightning-button>
          </div>

          <!-- Disclaim Assets Button -->
          <div
            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-m-bottom_small"
          >
            <lightning-button
              variant="neutral"
              label="Disclaim Assets"
              title="Successor declines the account, assets handled per fund bylaws"
              icon-name="utility:close"
              onclick={handleDisclaim}
              disabled={isLoading}
              class="slds-size_1-of-1"
            >
            </lightning-button>
          </div>
        </div>
      </div>

      <!-- Confirmation Message -->
      <template if:true={selectedPathway}>
        <div class="slds-var-m-top_medium">
          <div
            class="slds-box slds-theme_success slds-text-align_center"
            aria-live="polite"
            aria-atomic="true"
          >
            <p class="slds-text-heading_small">
              ✓ Pathway Recorded: {selectedPathway}
            </p>
          </div>
        </div>
      </template>

      <!-- Loading Spinner -->
      <template if:true={isLoading}>
        <div class="slds-var-m-top_medium">
          <lightning-spinner
            alternative-text="Saving pathway selection..."
          ></lightning-spinner>
        </div>
      </template>

      <!-- Error Message -->
      <template if:true={errorMessage}>
        <div class="slds-var-m-top_medium">
          <div class="slds-scoped-notification slds-theme_error" role="alert">
            <div class="slds-media">
              <div class="slds-media__figure">
                <lightning-icon
                  icon-name="utility:error"
                  variant="error"
                  size="small"
                  alternative-text="Error"
                >
                </lightning-icon>
              </div>
              <div class="slds-media__body">
                <p><strong>Error:</strong> {errorMessage}</p>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Footer with Close Button -->
    <div slot="footer" class="slds-text-align_right">
      <lightning-button
        label="Close"
        title="Close this action"
        onclick={handleClose}
        disabled={isLoading}
      >
      </lightning-button>
    </div>
  </lightning-card>
</template>
