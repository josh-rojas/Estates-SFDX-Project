<template>
    <lightning-card title="Succession Test Data Generator" icon-name="standard:data_integration_hub">
        <div class="slds-p-around_medium">
            
            <!-- Header Info -->
            <div class="slds-box slds-theme_info slds-m-bottom_medium">
                <p class="slds-text-body_regular">
                    <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                    Generate BRD-compliant test data for DAF Account Succession Management workflows.
                </p>
                <p class="slds-text-body_small slds-m-top_small">
                    ⚠️ <strong>Sandbox Only:</strong> Do not use in production environments.
                </p>
            </div>

            <!-- Scenario Cards -->
            <div class="slds-grid slds-wrap slds-gutters_small">
                <template for:each={scenarios} for:item="scenario">
                    <div key={scenario.value} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                        <article class="slds-card slds-m-bottom_small">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name={scenario.icon} size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title">
                                            <span class="slds-text-heading_small">{scenario.label}</span>
                                        </h2>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <p class="slds-text-body_small slds-text-color_weak">
                                    {scenario.description}
                                </p>
                            </div>
                            <footer class="slds-card__footer">
                                <lightning-button
                                    variant="brand"
                                    label="Generate"
                                    data-scenario={scenario.value}
                                    onclick={handleGenerateData}
                                    disabled={isProcessing}
                                    icon-name="utility:add"
                                    class="slds-m-left_x-small">
                                </lightning-button>
                            </footer>
                        </article>
                    </div>
                </template>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isGenerating}>
                <div class="slds-m-top_medium slds-m-bottom_medium">
                    <lightning-spinner alternative-text="Generating test data..." size="medium"></lightning-spinner>
                    <p class="slds-text-align_center slds-text-body_regular slds-m-top_small">
                        Generating test data... This may take a few seconds.
                    </p>
                </div>
            </template>

            <!-- Generation Result -->
            <template if:true={showResult}>
                <div class={resultClass}>
                    <h3 class="slds-text-heading_small slds-m-bottom_small">
                        {generationResult.message}
                    </h3>
                    <p class="slds-text-body_small">
                        {generationResult.details}
                    </p>
                </div>
            </template>

            <!-- Delete All Section -->
            <div class="slds-m-top_large">
                <div class="slds-box slds-theme_warning">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">
                        <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                        Danger Zone
                    </h3>
                    <p class="slds-text-body_small slds-m-bottom_small">
                        Delete all succession test data created by this tool. This action cannot be undone.
                    </p>
                    <lightning-button
                        variant="destructive"
                        label="Delete All Test Data"
                        onclick={handleDeleteAll}
                        disabled={isProcessing}
                        icon-name="utility:delete">
                    </lightning-button>
                </div>
            </div>

            <!-- Documentation Link -->
            <div class="slds-m-top_medium slds-text-align_center">
                <p class="slds-text-body_small slds-text-color_weak">
                    <lightning-icon icon-name="utility:knowledge_base" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                    See <strong>/docs/test-data-factory-usage.md</strong> for developer documentation
                </p>
            </div>

        </div>
    </lightning-card>
</template>
