<template>
    <div class="slds-box">
        <h2 class="slds-text-heading_small slds-m-bottom_medium">Grant Beneficiaries</h2>

        <p class="slds-m-bottom_medium">
            Specify the charitable organizations and grant amounts. Total grants must equal the account balance (±5%).
            Minimum grant amount: <strong>$50 per charity</strong>.
        </p>

        <!-- Balance Summary -->
        <div class="slds-grid slds-gutters slds-m-bottom_large">
            <div class="slds-col slds-size_1-of-3">
                <div class="slds-box slds-theme_shade">
                    <p class="slds-text-body_small slds-text-color_weak">Account Balance</p>
                    <p class="slds-text-heading_medium">{formattedAccountBalance}</p>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-3">
                <div class="slds-box slds-theme_shade">
                    <p class="slds-text-body_small slds-text-color_weak">Total Grants</p>
                    <p class="slds-text-heading_medium">{formattedTotalGrant}</p>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-3">
                <div class={balanceStatus}>
                    <p class="slds-text-body_small slds-text-color_weak">Remaining</p>
                    <p class="slds-text-heading_medium">{formattedRemainingBalance}</p>
                </div>
            </div>
        </div>

        <!-- Balance Status Message -->
        <div class="balance-message slds-m-bottom_medium">
            <template if:true={isBalanced}>
                <div class="slds-box slds-theme_success">
                    <lightning-icon icon-name="utility:success" variant="success" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    {balanceMessage}
                </div>
            </template>

            <template if:false={isBalanced}>
                <div class="slds-box slds-theme_warning">
                    <lightning-icon icon-name="utility:warning" variant="warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    {balanceMessage}
                </div>
            </template>
        </div>

        <!-- Beneficiary Table -->
        <div class="slds-scrollable_x">
            <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col" style="width: 25%;">
                            <div class="slds-truncate" title="Charity Name">Charity Name *</div>
                        </th>
                        <th scope="col" style="width: 15%;">
                            <div class="slds-truncate" title="EIN">EIN (optional)</div>
                        </th>
                        <th scope="col" style="width: 20%;">
                            <div class="slds-truncate" title="Amount">Grant Amount *</div>
                        </th>
                        <th scope="col" style="width: 30%;">
                            <div class="slds-truncate" title="Purpose">Purpose (optional)</div>
                        </th>
                        <th scope="col" style="width: 10%;">
                            <div class="slds-truncate" title="Actions">Actions</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={_beneficiaries} for:item="beneficiary">
                        <tr key={beneficiary.id} class="slds-hint-parent">
                            <!-- Charity Name -->
                            <td data-label="Charity Name">
                                <lightning-input
                                    type="text"
                                    value={beneficiary.charityName}
                                    data-id={beneficiary.id}
                                    data-field="charityName"
                                    onchange={handleInputChange}
                                    placeholder="Enter charity name"
                                    variant="label-hidden"
                                    required>
                                </lightning-input>
                            </td>

                            <!-- EIN -->
                            <td data-label="EIN">
                                <lightning-input
                                    type="text"
                                    value={beneficiary.ein}
                                    data-id={beneficiary.id}
                                    data-field="ein"
                                    onchange={handleInputChange}
                                    placeholder="XX-XXXXXXX"
                                    variant="label-hidden"
                                    pattern="[0-9]{2}-[0-9]{7}"
                                    max-length="10">
                                </lightning-input>
                            </td>

                            <!-- Amount -->
                            <td data-label="Grant Amount">
                                <lightning-input
                                    type="number"
                                    value={beneficiary.amount}
                                    data-id={beneficiary.id}
                                    onchange={handleAmountChange}
                                    placeholder="0.00"
                                    variant="label-hidden"
                                    formatter="currency"
                                    step="0.01"
                                    min={MIN_GRANT_AMOUNT}
                                    required>
                                </lightning-input>
                            </td>

                            <!-- Purpose -->
                            <td data-label="Purpose">
                                <lightning-input
                                    type="text"
                                    value={beneficiary.purpose}
                                    data-id={beneficiary.id}
                                    data-field="purpose"
                                    onchange={handleInputChange}
                                    placeholder="General operating support"
                                    variant="label-hidden">
                                </lightning-input>
                            </td>

                            <!-- Remove Button -->
                            <td data-label="Actions">
                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    variant="bare"
                                    alternative-text="Remove"
                                    title="Remove this beneficiary"
                                    data-id={beneficiary.id}
                                    onclick={removeBeneficiary}>
                                </lightning-button-icon>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Action Buttons -->
        <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
            <div class="slds-col">
                <lightning-button
                    label="Add Beneficiary"
                    icon-name="utility:add"
                    onclick={addBeneficiary}
                    variant="neutral">
                </lightning-button>
            </div>

            <div class="slds-col slds-text-align_right">
                <lightning-button
                    label="Distribute Evenly"
                    icon-name="utility:sync"
                    onclick={handleDistributeEvenly}
                    variant="neutral"
                    title="Divide account balance evenly among all beneficiaries">
                </lightning-button>
            </div>
        </div>

        <!-- Instructions -->
        <div class="slds-box slds-theme_shade slds-m-top_large">
            <p class="slds-text-body_small">
                <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                <strong>Tip:</strong> Use the "Distribute Evenly" button to automatically split the account balance
                across all beneficiaries, then adjust amounts as needed.
            </p>
        </div>
    </div>
</template>
