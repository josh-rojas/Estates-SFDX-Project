<template>
    <!-- Loading Spinner -->
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading..." size="large"></lightning-spinner>
    </template>

    <!-- Error State -->
    <template if:true={errorMessage}>
        <div class="slds-box slds-theme_error slds-m-around_medium">
            <lightning-icon icon-name="utility:error" variant="error" size="small" class="slds-m-right_small"></lightning-icon>
            <h2 class="slds-text-heading_small slds-m-bottom_small">Access Error</h2>
            <p>{errorMessage}</p>

            <template if:true={tokenValidation.isExpired}>
                <p class="slds-m-top_small">
                    This link expired on {tokenValidation.expirationDate}. Please contact support for a new link.
                </p>
            </template>

            <template if:true={tokenValidation.isAlreadyUsed}>
                <p class="slds-m-top_small">
                    Your succession pathway form was previously submitted. If you need to make changes, please contact support.
                </p>
            </template>
        </div>
    </template>

    <!-- Success State (Post-Submission) -->
    <template if:true={showSuccessMessage}>
        <div class="slds-box slds-theme_success slds-m-around_medium slds-text-align_center">
            <lightning-icon icon-name="action:approval" variant="success" size="large"></lightning-icon>
            <h1 class="slds-text-heading_large slds-m-top_medium">Thank You!</h1>
            <p class="slds-m-top_small slds-text-body_regular">
                {submissionResult.message}
            </p>
            <p class="slds-m-top_medium slds-text-body_small">
                Reference Number: <strong>{submissionResult.caseNumber}</strong>
            </p>
            <p class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                You may now close this window. Our team will contact you within 2 business days.
            </p>
        </div>
    </template>

    <!-- Main Form (only show if token valid and not submitted) -->
    <template if:true={tokenValidation.isValid}>
        <template if:false={showSuccessMessage}>
            <div class="succession-form-container">

                <!-- Header -->
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <h1 class="slds-text-heading_medium">Succession Pathway Recommendation Form</h1>
                    <p class="slds-text-body_small slds-m-top_x-small">Case: {caseNumber}</p>
                </div>

                <!-- Progress Bar -->
                <div class="slds-m-bottom_large">
                    <lightning-progress-indicator current-step={currentStep} type="path" variant="base">
                        <template for:each={steps} for:item="step">
                            <lightning-progress-step
                                key={step.number}
                                label={step.label}
                                value={step.number}>
                            </lightning-progress-step>
                        </template>
                    </lightning-progress-indicator>
                </div>

                <!-- Multiple Successor Warning (appears on all steps if applicable) -->
                <template if:true={showMultipleSuccessorWarning}>
                    <div class="slds-box slds-theme_warning slds-m-bottom_medium">
                        <lightning-icon icon-name="utility:warning" variant="warning" size="small" class="slds-m-right_small"></lightning-icon>
                        <strong>Multiple Successors Detected</strong>
                        <p class="slds-m-top_x-small">
                            This account has {caseContext.successorCount} named successors. Each successor will receive
                            their own form and can make independent pathway selections. Your selection only applies to your portion.
                        </p>
                    </div>
                </template>

                <!-- Step 1: Welcome & Token Validation -->
                <template if:true={isStep1}>
                    <div class="slds-box slds-m-bottom_medium">
                        <h2 class="slds-text-heading_small slds-m-bottom_medium">Welcome</h2>
                        <p class="slds-m-bottom_small">
                            This secure form will help us process the succession of the donor-advised fund account
                            for <strong>{caseContext.deceasedDonorName}</strong>.
                        </p>
                        <p class="slds-m-bottom_small">
                            As a named successor, you have three pathway options:
                        </p>
                        <ul class="slds-list_dotted slds-m-left_large">
                            <li><strong>Final Grant:</strong> Distribute the account balance to charitable organizations</li>
                            <li><strong>New DAF Account:</strong> Transfer the account to yourself as a new donor</li>
                            <li><strong>Disclaim Assets:</strong> Decline the account per Schwab Charitable bylaws</li>
                        </ul>
                        <p class="slds-m-top_medium slds-text-body_small slds-text-color_weak">
                            This form takes approximately 10-15 minutes to complete. You can save your progress
                            and return using the same link within 30 days.
                        </p>
                    </div>
                </template>

                <!-- Step 2: Account Summary -->
                <template if:true={isStep2}>
                    <c-succession-account-summary
                        case-context={caseContext}>
                    </c-succession-account-summary>
                </template>

                <!-- Step 3: Successor Information Verification -->
                <template if:true={isStep3}>
                    <c-succession-successor-info
                        case-context={caseContext}>
                    </c-succession-successor-info>
                </template>

                <!-- Step 4: Pathway Selection -->
                <template if:true={isStep4}>
                    <c-succession-pathway-selector
                        selected-pathway={formData.pathway}
                        onpathwayselected={handlePathwaySelected}>
                    </c-succession-pathway-selector>
                </template>

                <!-- Step 5: Pathway-Specific Details -->
                <template if:true={isStep5}>

                    <!-- Final Grant: Grant Beneficiary Table -->
                    <template if:true={isFinalGrantPathway}>
                        <c-succession-grant-beneficiaries
                            beneficiaries={formData.grantBeneficiaries}
                            account-balance={caseContext.accountBalance}
                            onbeneficiariesupdated={handleGrantBeneficiariesUpdated}>
                        </c-succession-grant-beneficiaries>
                    </template>

                    <!-- New DAF: Email & Terms -->
                    <template if:true={isNewDAFPathway}>
                        <c-succession-new-daf-details
                            email={formData.newDAFEmail}
                            terms-acknowledged={formData.termsAcknowledged}
                            ondafemailupdated={handleDAFEmailUpdated}>
                        </c-succession-new-daf-details>
                    </template>

                    <!-- Disclaim: Reason & Attestation -->
                    <template if:true={isDisclaimPathway}>
                        <c-succession-disclaim-details
                            reason={formData.disclaimerReason}
                            legal-attestation={formData.legalAttestation}
                            ondisclaimerupdated={handleDisclaimerUpdated}>
                        </c-succession-disclaim-details>
                    </template>

                </template>

                <!-- Step 6: Document Upload -->
                <template if:true={isStep6}>
                    <c-succession-document-upload
                        pathway={formData.pathway}
                        uploaded-files={formData.uploadedFiles}
                        ondocumentsuploaded={handleDocumentsUploaded}>
                    </c-succession-document-upload>
                </template>

                <!-- Step 7: Review & E-Signature -->
                <template if:true={isStep7}>
                    <c-succession-review-and-sign
                        case-context={caseContext}
                        form-data={formData}
                        signature-name={formData.signatureName}
                        onsignaturecaptured={handleSignatureCaptured}
                        onnotesupdate={handleNotesUpdated}>
                    </c-succession-review-and-sign>
                </template>

                <!-- Navigation Footer -->
                <div class="slds-card__footer slds-p-around_medium slds-m-top_large">
                    <div class="slds-grid slds-grid_align-spread">

                        <!-- Previous Button -->
                        <div class="slds-col">
                            <lightning-button
                                if:true={canGoPrevious}
                                label="Previous"
                                icon-name="utility:chevronleft"
                                onclick={handlePrevious}
                                variant="neutral">
                            </lightning-button>
                        </div>

                        <!-- Save for Later Button (center) -->
                        <div class="slds-col slds-text-align_center">
                            <lightning-button
                                if:false={isLastStep}
                                label="Save for Later"
                                icon-name="utility:save"
                                onclick={handleSaveForLater}
                                variant="neutral">
                            </lightning-button>
                        </div>

                        <!-- Next / Submit Button -->
                        <div class="slds-col slds-text-align_right">
                            <template if:false={isLastStep}>
                                <lightning-button
                                    label="Next"
                                    icon-name="utility:chevronright"
                                    icon-position="right"
                                    onclick={handleNext}
                                    variant="brand"
                                    disabled={isNextDisabled}>
                                </lightning-button>
                            </template>

                            <template if:true={isLastStep}>
                                <lightning-button
                                    label="Submit Form"
                                    icon-name="utility:check"
                                    onclick={handleSubmit}
                                    variant="success"
                                    disabled={isNextDisabled}>
                                </lightning-button>
                            </template>
                        </div>

                    </div>
                </div>

            </div>
        </template>
    </template>
</template>
