<template>
    <div class="slds-box">
        <h2 class="slds-text-heading_small slds-m-bottom_medium">Disclaim Assets</h2>

        <div class="slds-box slds-theme_warning slds-m-bottom_large">
            <lightning-icon icon-name="utility:warning" variant="warning" size="small" class="slds-m-right_small"></lightning-icon>
            <strong>Important:</strong> Disclaiming your successor designation is an irrevocable decision. Please read
            the information below carefully before proceeding.
        </div>

        <p class="slds-m-bottom_large">
            By disclaiming your successor designation, you are formally declining to accept the donor-advised fund account.
            The account assets will be distributed according to the Schwab Charitable bylaws (Article 8.3), which typically
            means distribution to an alternate successor or residual beneficiary as specified in the account documentation.
        </p>

        <!-- Disclaimer Reason -->
        <div class="slds-form slds-form_stacked slds-m-bottom_large">
            <lightning-textarea
                label="Reason for Disclaimer"
                value={reason}
                onchange={handleReasonChange}
                required
                placeholder="Please provide your reason for disclaiming this account..."
                max-length="1000"
                field-level-help="This information helps us ensure proper handling of the account">
            </lightning-textarea>
        </div>

        <!-- What Happens Next -->
        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
            <h3 class="slds-text-heading_x-small slds-m-bottom_small">What happens after you disclaim:</h3>
            <ol class="slds-list_ordered slds-m-left_large">
                <li class="slds-m-bottom_x-small">
                    We will review your disclaimer and verify all documentation
                </li>
                <li class="slds-m-bottom_x-small">
                    The account will be distributed per Schwab Charitable bylaws Article 8.3
                </li>
                <li class="slds-m-bottom_x-small">
                    If an alternate successor is named, they will be notified
                </li>
                <li class="slds-m-bottom_x-small">
                    If no alternate successor exists, assets go to the residual beneficiary
                </li>
                <li class="slds-m-bottom_x-small">
                    You will receive written confirmation of the disclaimer within 10 business days
                </li>
            </ol>
        </div>

        <!-- Legal Attestation -->
        <div class="slds-form-element slds-m-top_medium">
            <div class="slds-form-element__control">
                <lightning-input
                    type="checkbox"
                    label=""
                    checked={legalAttestation}
                    onchange={handleAttestationChange}
                    required>
                </lightning-input>
                <label class="slds-checkbox__label">
                    <span class="slds-form-element__label">
                        <strong>I understand and acknowledge that:</strong>
                        <ul class="slds-list_dotted slds-m-left_large slds-m-top_x-small">
                            <li>This disclaimer is irrevocable and cannot be reversed</li>
                            <li>I will have no future claim to this account or its assets</li>
                            <li>The account will be distributed per Schwab Charitable bylaws</li>
                            <li>I am making this disclaimer voluntarily and without coercion</li>
                            <li>I have consulted with legal and/or tax advisors as appropriate</li>
                        </ul>
                    </span>
                </label>
            </div>
        </div>

        <!-- Tax/Legal Advisory -->
        <div class="slds-box slds-theme_info slds-m-top_large">
            <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_small"></lightning-icon>
            <p class="slds-text-body_small">
                <strong>Advisory:</strong> Disclaiming assets may have legal and tax implications. We strongly recommend
                consulting with a qualified attorney and tax advisor before proceeding. If you have questions, please
                contact us at 1-800-746-6216 before submitting this form.
            </p>
        </div>
    </div>
</template>
