<!--
  Create Succession Case Quick Action Component
  
  Lightning Web Component for FinancialAccount Quick Action.
  Creates succession case and handles loading/error/success states.
-->
<template>
  <!-- Loading State -->
  <template if:true={showLoading}>
    <div class="create-succession-case-loading slds-var-p-around_medium">
      <div class="create-succession-case-spinner">
        <div
          class="slds-spinner slds-spinner_medium"
          role="status"
          aria-label="Creating succession case"
        >
          <span class="slds-assistive-text">Creating succession case...</span>
          <div class="slds-spinner__dot-a" aria-hidden="true"></div>
          <div class="slds-spinner__dot-b" aria-hidden="true"></div>
        </div>
      </div>
      <div class="slds-text-align_center slds-var-m-top_medium">
        <p class="slds-text-body_regular">Creating succession case...</p>
      </div>
    </div>
  </template>

  <!-- Error State -->
  <template if:true={showError}>
    <div class="slds-var-p-around_medium">
      <div
        class="slds-notify slds-notify_alert slds-theme_alert-texture create-succession-case-alert create-succession-case-error"
        role="alert"
      >
        <span class="slds-assistive-text">Error</span>
        <span
          class="create-succession-case-icon slds-icon-utility-error slds-var-m-right_x-small"
          title="Error"
          aria-label="Error icon"
        >
          <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
            <use
              xlink:href="/apexpages/slds/latest/assets/icons/utility-sprite/svg/symbols.svg#error"
            ></use>
          </svg>
        </span>
        <h2 class="slds-text-heading_small">{errorMessage}</h2>
      </div>

      <div class="slds-var-m-top_medium slds-text-align_center">
        <lightning-button
          label="Close"
          onclick={handleClose}
          title="Close error dialog"
          variant="neutral"
          class="create-succession-case-button"
        ></lightning-button>
      </div>
    </div>
  </template>

  <!-- Success State -->
  <template if:true={showSuccess}>
    <div class="slds-var-p-around_medium">
      <div
        class="slds-notify slds-notify_alert slds-theme_alert-texture create-succession-case-alert create-succession-case-success"
        role="alert"
      >
        <span class="slds-assistive-text">Success</span>
        <span
          class="create-succession-case-icon slds-icon-utility-success slds-var-m-right_x-small"
          title="Success"
          aria-label="Success icon"
        >
          <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
            <use
              xlink:href="/apexpages/slds/latest/assets/icons/utility-sprite/svg/symbols.svg#success"
            ></use>
          </svg>
        </span>
        <h2 class="slds-text-heading_small">Case Created Successfully</h2>
      </div>

      <div class="slds-var-m-top_medium">
        <div
          class="slds-box create-succession-case-box create-succession-case-shade slds-var-p-around_medium"
        >
          <p class="slds-text-body_regular slds-var-m-bottom_small">
            {successMessage}
          </p>

          <template if:true={successorInfo}>
            <p class="slds-text-body_small create-succession-case-weak-text">
              {successorInfo}
            </p>
          </template>

          <div class="slds-var-m-top_small">
            <p class="slds-text-body_small create-succession-case-weak-text">
              You will be redirected to the case record automatically.
            </p>
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
