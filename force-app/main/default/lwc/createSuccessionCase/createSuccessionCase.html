<!--
  Create Succession Case Quick Action Component
  
  Lightning Web Component for FinancialAccount Quick Action.
  Creates succession case and handles loading/error/success states.
-->
<template>
  <!-- Empty state (before invoke is called) -->
  <template if:false={hasInvoked}>
    <div class="slds-var-p-around_medium">
      <p class="slds-text-align_center">
        Click the action button to create a succession case.
      </p>
    </div>
  </template>

  <!-- Loading State -->
  <template if:true={showLoading}>
    <div class="slds-is-relative slds-var-p-around_medium">
      <div
        class="create-succession-case-spinner slds-is-relative slds-show_inline-block slds-size_full"
      >
        <div
          class="slds-spinner slds-spinner_medium"
          role="status"
          aria-label="Creating succession case"
        >
          <span class="slds-assistive-text">Creating succession case...</span>
          <div class="slds-spinner__dot-a" aria-hidden="true"></div>
          <div class="slds-spinner__dot-b" aria-hidden="true"></div>
        </div>
      </div>
      <div class="slds-text-align_center slds-var-m-top_medium">
        <p class="slds-text-body_regular">Creating succession case...</p>
      </div>
    </div>
  </template>

  <!-- Error State -->
  <template if:true={showError}>
    <div class="slds-var-p-around_medium">
      <div
        class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error"
        role="alert"
      >
        <span class="slds-assistive-text">Error</span>
        <lightning-icon
          icon-name="utility:error"
          alternative-text="Error"
          size="x-small"
          variant="error"
          class="slds-var-m-right_x-small"
        ></lightning-icon>
        <h2 class="slds-text-heading_small">{errorMessage}</h2>
      </div>

      <div class="slds-var-m-top_medium slds-text-align_center">
        <lightning-button
          label="Close"
          onclick={handleClose}
          title="Close error dialog"
          variant="neutral"
          class="create-succession-case-button"
        ></lightning-button>
      </div>
    </div>
  </template>

  <!-- Success State -->
  <template if:true={showSuccess}>
    <div class="slds-var-p-around_medium">
      <div
        class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_success"
        role="alert"
      >
        <span class="slds-assistive-text">Success</span>
        <lightning-icon
          icon-name="utility:success"
          alternative-text="Success"
          size="x-small"
          variant="success"
          class="slds-var-m-right_x-small"
        ></lightning-icon>
        <h2 class="slds-text-heading_small">Case Created Successfully</h2>
      </div>

      <div class="slds-var-m-top_medium">
        <div class="slds-box slds-theme_shade slds-var-p-around_medium">
          <p class="slds-text-body_regular slds-var-m-bottom_small">
            {successMessage}
          </p>

          <template if:true={successorInfo}>
            <p class="slds-text-body_small slds-text-color_weak">
              {successorInfo}
            </p>
          </template>
        </div>
      </div>
    </div>
  </template>
</template>
