<template>
    <div class="slds-box">
        <h2 class="slds-text-heading_small slds-m-bottom_medium">Review and Sign</h2>

        <p class="slds-m-bottom_large">
            Please review your submission carefully. By signing below, you confirm that all information is accurate and complete.
        </p>

        <!-- Summary Sections -->

        <!-- 1. Deceased Donor & Account Summary -->
        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
            <h3 class="slds-text-heading_x-small slds-m-bottom_small">Deceased Donor & Account</h3>
            <dl class="slds-dl_horizontal">
                <dt class="slds-dl_horizontal__label">Deceased Donor:</dt>
                <dd class="slds-dl_horizontal__detail">{caseContext.deceasedDonorName}</dd>

                <dt class="slds-dl_horizontal__label">Account Name:</dt>
                <dd class="slds-dl_horizontal__detail">{caseContext.financialAccountName}</dd>

                <dt class="slds-dl_horizontal__label">Account Balance:</dt>
                <dd class="slds-dl_horizontal__detail"><strong>{formattedBalance}</strong></dd>
            </dl>
        </div>

        <!-- 2. Your Information -->
        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
            <h3 class="slds-text-heading_x-small slds-m-bottom_small">Your Information</h3>
            <dl class="slds-dl_horizontal">
                <dt class="slds-dl_horizontal__label">Name:</dt>
                <dd class="slds-dl_horizontal__detail">{caseContext.successorName}</dd>

                <dt class="slds-dl_horizontal__label">Email:</dt>
                <dd class="slds-dl_horizontal__detail">{caseContext.successorEmail}</dd>

                <dt class="slds-dl_horizontal__label">Phone:</dt>
                <dd class="slds-dl_horizontal__detail">{caseContext.successorPhone}</dd>
            </dl>
        </div>

        <!-- 3. Pathway Selection -->
        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
            <h3 class="slds-text-heading_x-small slds-m-bottom_small">Selected Pathway</h3>
            <p class="slds-text-heading_medium slds-text-color_success">{formData.pathway}</p>
        </div>

        <!-- 4. Pathway-Specific Details -->

        <!-- Final Grant Details -->
        <template if:true={isFinalGrant}>
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <h3 class="slds-text-heading_x-small slds-m-bottom_small">Grant Beneficiaries</h3>
                <p class="slds-m-bottom_small">Total Grants: <strong>{totalGrants}</strong></p>

                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr>
                            <th scope="col">Charity Name</th>
                            <th scope="col">EIN</th>
                            <th scope="col">Amount</th>
                            <th scope="col">Purpose</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={formData.grantBeneficiaries} for:item="beneficiary">
                            <tr key={beneficiary.id}>
                                <td>{beneficiary.charityName}</td>
                                <td>{beneficiary.ein}</td>
                                <td>{beneficiary.amount}</td>
                                <td>{beneficiary.purpose}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- New DAF Details -->
        <template if:true={isNewDAF}>
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <h3 class="slds-text-heading_x-small slds-m-bottom_small">New DAF Account Details</h3>
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label">Email for New Account:</dt>
                    <dd class="slds-dl_horizontal__detail">{formData.newDAFEmail}</dd>

                    <dt class="slds-dl_horizontal__label">Terms Acknowledged:</dt>
                    <dd class="slds-dl_horizontal__detail">
                        <template if:true={formData.termsAcknowledged}>
                            <lightning-icon icon-name="utility:check" variant="success" size="x-small"></lightning-icon>
                            Yes
                        </template>
                    </dd>
                </dl>
            </div>
        </template>

        <!-- Disclaim Details -->
        <template if:true={isDisclaim}>
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <h3 class="slds-text-heading_x-small slds-m-bottom_small">Disclaimer Details</h3>
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label">Reason:</dt>
                    <dd class="slds-dl_horizontal__detail">{formData.disclaimerReason}</dd>

                    <dt class="slds-dl_horizontal__label">Legal Attestation:</dt>
                    <dd class="slds-dl_horizontal__detail">
                        <template if:true={formData.legalAttestation}>
                            <lightning-icon icon-name="utility:check" variant="success" size="x-small"></lightning-icon>
                            Acknowledged
                        </template>
                    </dd>
                </dl>
            </div>
        </template>

        <!-- 5. Uploaded Documents -->
        <template if:true={formData.uploadedFiles.length}>
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <h3 class="slds-text-heading_x-small slds-m-bottom_small">Uploaded Documents ({formData.uploadedFiles.length})</h3>
                <ul class="slds-list_dotted slds-m-left_large">
                    <template for:each={formData.uploadedFiles} for:item="file">
                        <li key={file.documentId}>{file.name}</li>
                    </template>
                </ul>
            </div>
        </template>

        <!-- Additional Notes (Optional) -->
        <div class="slds-form-element slds-m-vertical_large">
            <lightning-textarea
                label="Additional Notes (Optional)"
                value={notes}
                onchange={handleNotesChange}
                placeholder="Include any additional information or comments for our team..."
                max-length="2000">
            </lightning-textarea>
        </div>

        <!-- E-Signature Section -->
        <div class="slds-box slds-theme_warning slds-m-bottom_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_medium">Electronic Signature</h3>

            <p class="slds-m-bottom_medium">
                By typing your full legal name below, you are providing your electronic signature and agreeing to the
                following:
            </p>

            <ul class="slds-list_ordered slds-m-left_large slds-m-bottom_medium">
                <li>All information provided in this form is true, accurate, and complete</li>
                <li>You are the named successor for this account</li>
                <li>You understand the implications of your selected pathway</li>
                <li>You agree to provide any additional documentation as requested</li>
                <li>This signature has the same legal effect as a handwritten signature</li>
            </ul>

            <lightning-input
                type="text"
                label="Type Your Full Legal Name"
                value={signatureName}
                onchange={handleSignatureChange}
                placeholder="John Q. Successor"
                required
                class="slds-m-bottom_medium">
            </lightning-input>

            <div class="slds-form-element">
                <lightning-input
                    type="checkbox"
                    label="I acknowledge that this is my electronic signature"
                    checked={signatureAcknowledged}
                    onchange={handleAcknowledgmentChange}
                    required>
                </lightning-input>
            </div>

            <p class="slds-text-body_small slds-text-color_weak slds-m-top_medium">
                Signed on: <strong>{currentDateTime}</strong><br/>
                IP Address: <strong>{formData.ipAddress}</strong>
            </p>
        </div>

        <!-- Privacy Notice -->
        <div class="slds-box slds-theme_info slds-m-top_large">
            <lightning-icon icon-name="utility:lock" size="small" class="slds-m-right_small"></lightning-icon>
            <p class="slds-text-body_small">
                <strong>Privacy &amp; Security:</strong> Your information is encrypted and transmitted securely.
                This submission will be reviewed by our team within 2 business days. You will receive email
                confirmation once processed.
            </p>
        </div>

    </div>
</template>
