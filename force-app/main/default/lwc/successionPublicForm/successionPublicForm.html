<template>
  <div class="succession-scope">
    <!-- Header -->
    <div class="slds-page-header slds-m-bottom_medium">
      <div class="slds-page-header__row">
        <div class="slds-page-header__col-title">
          <div class="slds-media">
            <div class="slds-media__body">
              <h1 class="slds-page-header__title slds-text-heading_large">
                Succession Pathway Selection Form
              </h1>
              <p class="slds-text-body_regular slds-m-top_x-small">
                Please complete this form to make your succession pathway
                selection
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Spinner -->
    <template if:true={loading}>
      <div class="slds-align_absolute-center slds-m-vertical_xx-large">
        <lightning-spinner
          alternative-text="Loading form..."
          size="large"
        ></lightning-spinner>
      </div>
    </template>

    <!-- Error State -->
    <template if:true={hasError}>
      <div class="slds-m-around_medium">
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          <span class="slds-assistive-text">Error</span>
          <h2>{error}</h2>
        </div>
      </div>
    </template>

    <!-- Form Submitted Success -->
    <template if:true={formSubmitted}>
      <div class="slds-m-around_medium">
        <div
          class="slds-notify slds-notify_alert slds-theme_success"
          role="alert"
        >
          <span class="slds-assistive-text">Success</span>
          <h2 class="slds-text-heading_medium slds-m-bottom_small">
            Thank You!
          </h2>
          <p class="slds-text-body_regular">
            Your pathway selection has been submitted successfully. Our Estate
            Administration team will review your submission and contact you
            regarding next steps.
          </p>
          <p class="slds-text-body_regular slds-m-top_small">
            <strong>Case Number:</strong> {formData.caseNumber}
          </p>
        </div>
      </div>
    </template>

    <!-- Form Content -->
    <template if:true={isFormReady}>
      <div class="slds-m-around_medium">
        <!-- Pre-filled Information Section -->
        <lightning-card
          title="Account Information"
          icon-name="standard:account"
        >
          <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <dl class="slds-dl_horizontal">
                  <dt class="slds-dl_horizontal__label">
                    <p class="slds-truncate">Deceased Account Holder:</p>
                  </dt>
                  <dd class="slds-dl_horizontal__detail slds-tile__meta">
                    <p class="slds-truncate">{formData.accountName}</p>
                  </dd>
                  <dt class="slds-dl_horizontal__label">
                    <p class="slds-truncate">Financial Account:</p>
                  </dt>
                  <dd class="slds-dl_horizontal__detail slds-tile__meta">
                    <p class="slds-truncate">{formData.financialAccountName}</p>
                  </dd>
                  <dt class="slds-dl_horizontal__label">
                    <p class="slds-truncate">Account Number:</p>
                  </dt>
                  <dd class="slds-dl_horizontal__detail slds-tile__meta">
                    <p class="slds-truncate">
                      {formData.financialAccountNumber}
                    </p>
                  </dd>
                </dl>
              </div>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <dl class="slds-dl_horizontal">
                  <dt class="slds-dl_horizontal__label">
                    <p class="slds-truncate">Account Balance:</p>
                  </dt>
                  <dd class="slds-dl_horizontal__detail slds-tile__meta">
                    <p class="slds-truncate slds-text-heading_small">
                      {accountBalanceFormatted}
                    </p>
                  </dd>
                  <dt class="slds-dl_horizontal__label">
                    <p class="slds-truncate">Your Allocation:</p>
                  </dt>
                  <dd class="slds-dl_horizontal__detail slds-tile__meta">
                    <p class="slds-truncate slds-text-heading_small">
                      {allocationPercentageFormatted}
                    </p>
                  </dd>
                  <dt class="slds-dl_horizontal__label">
                    <p class="slds-truncate">Case Number:</p>
                  </dt>
                  <dd class="slds-dl_horizontal__detail slds-tile__meta">
                    <p class="slds-truncate">{formData.caseNumber}</p>
                  </dd>
                </dl>
              </div>
            </div>
          </div>
        </lightning-card>

        <!-- Successor Information -->
        <lightning-card
          title="Your Information"
          icon-name="standard:contact"
          class="slds-m-top_medium"
        >
          <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <dl class="slds-dl_horizontal">
                  <dt class="slds-dl_horizontal__label">
                    <p class="slds-truncate">Name:</p>
                  </dt>
                  <dd class="slds-dl_horizontal__detail slds-tile__meta">
                    <p class="slds-truncate">{formData.successorName}</p>
                  </dd>
                </dl>
              </div>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <dl class="slds-dl_horizontal">
                  <dt class="slds-dl_horizontal__label">
                    <p class="slds-truncate">Email:</p>
                  </dt>
                  <dd class="slds-dl_horizontal__detail slds-tile__meta">
                    <p class="slds-truncate">{formData.successorEmail}</p>
                  </dd>
                </dl>
              </div>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <dl class="slds-dl_horizontal">
                  <dt class="slds-dl_horizontal__label">
                    <p class="slds-truncate">Phone:</p>
                  </dt>
                  <dd class="slds-dl_horizontal__detail slds-tile__meta">
                    <p class="slds-truncate">{formData.successorPhone}</p>
                  </dd>
                </dl>
              </div>
            </div>
          </div>
        </lightning-card>

        <!-- Pathway Selection -->
        <lightning-card
          title="Select Your Pathway"
          icon-name="standard:opportunity"
          class="slds-m-top_medium"
        >
          <div class="slds-p-around_medium">
            <div class="slds-form" role="list">
              <lightning-radio-group
                name="pathwaySelection"
                label="Please select one of the following options:"
                options={pathwayOptions}
                value={selectedPathway}
                onchange={handlePathwayChange}
                type="radio"
                required
              >
              </lightning-radio-group>

              <div class="slds-m-top_large">
                <p class="slds-text-body_small slds-m-bottom_small">
                  <strong>Option Descriptions:</strong>
                </p>
                <ul class="slds-list_dotted slds-text-body_small">
                  <li>
                    <strong>Final Grant to Charity:</strong> Direct the account
                    balance as charitable grants to organizations of your choice
                  </li>
                  <li>
                    <strong>Transfer to New DAF Account:</strong> Become the new
                    account holder and continue charitable giving
                  </li>
                  <li>
                    <strong>Disclaim Successor Rights:</strong> Decline your
                    rights, and the account will be handled per organizational
                    policy
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </lightning-card>

        <!-- Additional Notes -->
        <lightning-card
          title="Additional Information (Optional)"
          icon-name="standard:note"
          class="slds-m-top_medium"
        >
          <div class="slds-p-around_medium">
            <lightning-textarea
              name="additionalNotes"
              label="Notes or Special Instructions"
              value={additionalNotes}
              onchange={handleNotesChange}
              placeholder="Enter any additional information, questions, or special instructions..."
            >
            </lightning-textarea>
          </div>
        </lightning-card>

        <!-- Form Actions -->
        <div class="slds-m-top_large slds-text-align_center">
          <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={handleCancel}
            class="slds-m-right_small"
          >
          </lightning-button>
          <lightning-button
            variant="brand"
            label="Submit Pathway Selection"
            onclick={handleSubmit}
            disabled={isSubmitDisabled}
          >
          </lightning-button>
        </div>

        <!-- Support Information -->
        <div class="slds-box slds-m-top_large slds-theme_shade">
          <p class="slds-text-body_small">
            <strong>Need Help?</strong><br />
            If you have questions or need assistance, please contact our Estate
            Administration team at
            <strong>1-800-746-2227</strong> and reference Case Number
            <strong>{formData.caseNumber}</strong>.
          </p>
        </div>
      </div>
    </template>
  </div>
</template>
