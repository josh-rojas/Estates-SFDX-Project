<template>
  <lightning-card>
    <!-- Custom Card Header with Toggle Button -->
    <div slot="title" class="card-header-container">
      <lightning-button-icon
        icon-name={toggleIcon}
        alternative-text={toggleTitle}
        title={toggleTitle}
        onclick={toggleCollapse}
        class="toggle-button-left"
      ></lightning-button-icon>
      <lightning-icon
        icon-name="standard:task"
        size="small"
        class="header-icon"
      ></lightning-icon>
      <span class="card-title">Contact Cadence Progress</span>
    </div>

    <!-- Status Announcement for Screen Readers -->
    <div class="slds-assistive-text" aria-live="polite" aria-atomic="true">
      {statusAnnouncement}
    </div>

    <!-- Loading Spinner -->
    <template if:true={isLoading}>
      <lightning-spinner
        alternative-text="Loading contact cadence..."
        size="small"
      ></lightning-spinner>
    </template>

    <!-- Invalid Record Type Message -->
    <template if:true={showInvalidRecordType}>
      <div class="slds-var-m-around_medium">
        <div
          class="slds-box slds-theme_warning slds-var-m-bottom_medium"
          role="alert"
          aria-live="polite"
          aria-atomic="true"
        >
          <h2 class="slds-text-heading_small slds-var-m-bottom_x-small">
            Invalid Record Type
          </h2>
          <p>{invalidRecordTypeMessage}</p>
        </div>
      </div>
    </template>

    <!-- Error Message -->
    <template if:true={error}>
      <div class="slds-var-m-around_medium">
        <div
          class="slds-box slds-theme_error slds-var-m-bottom_medium"
          role="alert"
          aria-live="assertive"
          aria-atomic="true"
        >
          <h2>Error loading contact cadence</h2>
          <template if:true={errorMessage}>
            <p>{errorMessage}</p>
          </template>
          <template if:false={errorMessage}>
            <p>An unknown error occurred loading contact cadence</p>
          </template>
        </div>
      </div>
    </template>

    <!-- No Data Message -->
    <template if:false={hasData}>
      <template if:false={isLoading}>
        <template if:false={showInvalidRecordType}>
          <div class="slds-var-m-around_medium slds-text-color_weak">
            <p>
              No contact attempts found. Contact cadence will begin when case is
              created.
            </p>
          </div>
        </template>
      </template>
    </template>

    <!-- Contact Cadence Display - Collapsible Body -->
    <template if:true={hasData}>
      <div class="slds-var-m-around_small">
        <div class={collapsibleContentClass}>
          <!-- Email Warning Alert (opt-out, missing email, invalid format) -->
          <template if:true={hasEmailWarning}>
            <div
              class="slds-box slds-theme_warning slds-var-m-bottom_medium"
              role="alert"
              aria-live="polite"
              aria-atomic="true"
            >
              <div class="slds-grid slds-grid_align-end">
                <div class="slds-col">
                  <lightning-icon
                    icon-name="utility:warning"
                    size="x-small"
                    class="slds-var-m-right_x-small"
                  ></lightning-icon>
                  <span class="slds-text-body_regular">
                    <strong>Email Issue:</strong> {emailWarningMessage}
                  </span>
                </div>
              </div>
            </div>
          </template>

          <!-- Attempt Cards Grid -->
          <div class="attempts-grid">
            <template for:each={attemptsWithProps} for:item="attempt">
              <div key={attempt.attemptNumber} class={attempt.cardClass}>
                <!-- Card Header -->
                <div class="card-header slds-var-m-bottom_small">
                  <h3 class="slds-text-heading_small">
                    {attempt.attemptLabel}
                  </h3>
                  <p class="slds-text-body_small slds-text-color_weak">
                    {attempt.dayLabel}
                  </p>
                </div>

                <!-- Completed Card (Read-Only) -->
                <template if:true={attempt.showReadOnly}>
                  <div class="card-content">
                    <!-- Contact Made Status -->
                    <div
                      class="slds-form-element slds-var-m-bottom_small succession-form-element-noborder"
                    >
                      <label
                        class="slds-form-element__label slds-text-body_small"
                        >Contact Made?</label
                      >
                      <template if:true={attempt.taskRecord}>
                        <template
                          if:true={attempt.taskRecord.Succession_Contact_Established__c}
                        >
                          <p
                            class="slds-text-body_regular succession-text-color-success"
                          >
                            <lightning-icon
                              icon-name="utility:check"
                              size="x-small"
                              variant="success"
                              class="slds-var-m-right_xx-small"
                            ></lightning-icon>
                            <strong>Yes - Contact Established</strong>
                          </p>
                        </template>
                        <template
                          if:false={attempt.taskRecord.Succession_Contact_Established__c}
                        >
                          <p
                            class="slds-text-body_regular succession-text-color-error"
                          >
                            <lightning-icon
                              icon-name="utility:close"
                              size="x-small"
                              class="slds-var-m-right_xx-small"
                            ></lightning-icon>
                            <strong>No - Contact Not Made</strong>
                          </p>
                        </template>
                      </template>
                    </div>

                    <!-- Agent Notes - Always show section, even if empty -->
                    <div
                      class="slds-form-element succession-form-element-noborder"
                    >
                      <label
                        class="slds-form-element__label slds-text-body_small"
                        >Agent Notes</label
                      >
                      <template if:true={attempt.taskNotes}>
                        <div
                          class="notes-display slds-box slds-box_x-small slds-var-p-around_small"
                        >
                          <p class="slds-text-body_small">
                            {attempt.taskNotes}
                          </p>
                        </div>
                      </template>
                      <template if:false={attempt.taskNotes}>
                        <div
                          class="notes-display slds-box slds-box_x-small slds-var-p-around_small"
                        >
                          <p class="slds-text-body_small slds-text-color_weak">
                            No notes recorded
                          </p>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Locked Card - Task exists but date hasn't arrived -->
                <template if:true={attempt.isLocked}>
                  <div class="card-content card-locked">
                    <div class="countdown-bar" role="status">
                      <div class="countdown-bar-content">
                        <lightning-icon
                          icon-name="utility:lock"
                          size="x-small"
                          class="countdown-icon"
                        ></lightning-icon>
                        <div class="countdown-text-container">
                          <p class="countdown-primary-text">
                            {attempt.countdownText}
                          </p>
                          <p class="countdown-secondary-text">
                            Est. {attempt.dueDate}
                          </p>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Current Card (Editable) - Date has arrived -->
                <template if:true={attempt.isCurrent}>
                  <template if:false={attempt.showEditForm}>
                    <!-- Not editing - show Record Outcome button -->
                    <div class="card-content">
                      <template if:true={attempt.taskRecord}>
                        <template if:true={attempt.isDateArrived}>
                          <lightning-button
                            variant="brand"
                            label="Record Outcome"
                            data-task-id={attempt.taskRecord.Id}
                            data-attempt-number={attempt.attemptNumber}
                            onclick={handleEdit}
                            class="slds-var-m-top_small"
                          >
                          </lightning-button>
                        </template>
                        <template if:false={attempt.isDateArrived}>
                          <div class="countdown-bar" role="status">
                            <div class="countdown-bar-content">
                              <lightning-icon
                                icon-name="utility:lock"
                                size="x-small"
                                class="countdown-icon"
                              ></lightning-icon>
                              <div class="countdown-text-container">
                                <p class="countdown-primary-text">
                                  {attempt.countdownText}
                                </p>
                                <p class="countdown-secondary-text">
                                  Est. {attempt.dueDate}
                                </p>
                              </div>
                            </div>
                          </div>
                        </template>
                      </template>
                    </div>
                  </template>

                  <template if:true={attempt.showEditForm}>
                    <!-- Editing - show inline form (center-aligned) -->
                    <div class="card-content slds-text-align_center">
                      <!-- Question Header -->
                      <div class="slds-var-m-bottom_small">
                        <p
                          class="slds-text-heading_small slds-var-m-bottom_x-small"
                        >
                          Was contact made with potential successor?
                        </p>
                      </div>

                      <!-- Radio Buttons (Yes/No) -->
                      <div
                        class="slds-form-element slds-var-m-bottom_medium succession-form-element-noborder"
                      >
                        <lightning-radio-group
                          name="contactMade"
                          options={contactMadeOptions}
                          value={state.editing.contactMade}
                          onchange={handleContactMadeChange}
                          type="button"
                        >
                        </lightning-radio-group>
                      </div>

                      <!-- Notes Text Area -->
                      <div
                        class="slds-form-element slds-var-m-bottom_medium succession-form-element-noborder"
                      >
                        <label
                          class="slds-form-element__label succession-label-center"
                        >
                          Agent Notes
                        </label>
                        <div class="slds-form-element__control">
                          <lightning-textarea
                            value={state.editing.notes}
                            onchange={handleNotesChange}
                            placeholder="Enter your notes about this contact attempt..."
                            class="slds-align_absolute-center"
                          >
                          </lightning-textarea>
                        </div>
                      </div>

                      <!-- Action Buttons (Centered) -->
                      <div
                        class="slds-grid slds-grid_align-center slds-gutters_small"
                      >
                        <div class="slds-col">
                          <lightning-button
                            variant="neutral"
                            label="Cancel"
                            onclick={handleCancel}
                            class="slds-var-m-right_small"
                          >
                          </lightning-button>
                        </div>
                        <div class="slds-col">
                          <template if:true={attempt.taskRecord}>
                            <lightning-button
                              variant="brand"
                              label="Save Outcome"
                              data-task-id={attempt.taskRecord.Id}
                              onclick={handleSaveOutcome}
                            >
                            </lightning-button>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                </template>

                <!-- Pending Card - Waiting for previous attempts -->
                <template if:true={attempt.showDisabled}>
                  <div class="card-content card-disabled">
                    <lightning-icon
                      icon-name="utility:clock"
                      size="x-small"
                      class="slds-var-m-right_xx-small"
                    ></lightning-icon>
                    <span class="slds-text-body_small slds-text-color_weak"
                      >Complete previous attempts first</span
                    >
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </lightning-card>
</template>
