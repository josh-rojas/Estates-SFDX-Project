<template>
  <lightning-card title="Contact Cadence Progress" icon-name="standard:task">
    <!-- Loading Spinner -->
    <template if:true={isLoading}>
      <lightning-spinner
        alternative-text="Loading contact cadence..."
        size="small"
      ></lightning-spinner>
    </template>

    <!-- Invalid Record Type Message -->
    <template if:true={showInvalidRecordType}>
      <div class="slds-var-m-around_medium">
        <div
          class="slds-notify slds-notify_alert slds-alert_warning"
          role="alert"
        >
          <span class="slds-assistive-text">Warning</span>
          <h2 class="slds-text-heading_small slds-var-m-bottom_x-small">
            Invalid Record Type
          </h2>
          <p>{invalidRecordTypeMessage}</p>
        </div>
      </div>
    </template>

    <!-- Error Message -->
    <template if:true={error}>
      <div class="slds-var-m-around_medium">
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          <h2>Error loading contact cadence</h2>
          <p>{error.body.message}</p>
          <template if:false={error.body}>
            <p>An unknown error occurred loading contact cadence</p>
          </template>
        </div>
      </div>
    </template>

    <!-- No Data Message -->
    <template if:false={hasData}>
      <template if:false={isLoading}>
        <template if:false={showInvalidRecordType}>
          <div class="slds-var-m-around_medium slds-text-color_weak">
            <p>
              No contact attempts found. Contact cadence will begin when case is
              created.
            </p>
          </div>
        </template>
      </template>
    </template>

    <!-- Contact Cadence Display -->
    <template if:true={hasData}>
      <div class="slds-card__body slds-card__body_inner">
        <!-- Progress Bar Section -->
        <div class="progress-section slds-var-m-bottom_large">
          <!-- Progress Status Header -->
          <div class="slds-grid slds-grid_align-spread slds-var-m-bottom_medium">
            <div class="slds-col">
              <p class="slds-text-heading_small">{progressStatusText}</p>
            </div>
            <template if:true={cadenceData.contactEstablished}>
              <div class="slds-col slds-text-align_right">
                <lightning-icon
                  icon-name="utility:success"
                  size="small"
                  variant="success"
                  class="slds-var-m-right_x-small"
                ></lightning-icon>
                <span class="succession-text-color-success">Contact Established</span>
              </div>
            </template>
          </div>

          <!-- Progress Bar -->
          <div class="progress-bar-container">
            <div class="progress-bar-track"></div>
            <div class="progress-bar-fill" style={progressBarStyle}></div>

            <!-- Progress Nodes (5 attempts) -->
            <div class="progress-nodes">
              <template for:each={attemptsWithProps} for:item="attempt">
                <div
                  key={attempt.attemptNumber}
                  class={attempt.progressNodeClass}
                >
                  <div class="node-circle">
                    <template if:true={attempt.isCompleted}>
                      <span class="node-icon">✓</span>
                    </template>
                    <template if:true={attempt.isCurrent}>
                      <span class="node-icon">⏺</span>
                    </template>
                    <template if:true={attempt.isPending}>
                      <span class="node-icon">○</span>
                    </template>
                  </div>
                  <p class="node-label slds-text-body_small">
                    {attempt.dayLabel}
                  </p>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- Email Warning Alert (opt-out, missing email, invalid format) -->
        <template if:true={hasEmailWarning}>
          <div
            class="slds-notify slds-notify_alert slds-alert_warning slds-var-m-bottom_medium"
            role="alert"
          >
            <div class="slds-grid slds-grid_align-end">
              <div class="slds-col">
                <lightning-icon
                  icon-name="utility:warning"
                  size="x-small"
                  class="slds-var-m-right_x-small"
                ></lightning-icon>
                <span class="slds-text-body_regular">
                  <strong>Email Issue:</strong> {emailWarningMessage}
                </span>
              </div>
            </div>
          </div>
        </template>

        <!-- Send Email Prompt (appears after saving NO outcome) -->
        <template if:true={pendingEmailAttemptNumber}>
          <div
            class="slds-notify slds-notify_alert slds-theme_info slds-var-m-bottom_medium"
            role="alert"
          >
            <div
              class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
            >
              <div class="slds-col">
                <lightning-icon
                  icon-name="utility:email"
                  size="x-small"
                  class="slds-var-m-right_x-small"
                ></lightning-icon>
                <span class="slds-text-body_regular">
                  <strong>Send follow-up email?</strong> (Optional)
                </span>
              </div>
              <div class="slds-col slds-no-flex">
                <lightning-button
                  variant="neutral"
                  label="Skip"
                  onclick={handleSkipEmail}
                  class="slds-var-m-right_x-small"
                >
                </lightning-button>
                <lightning-button
                  variant="brand"
                  label={sendEmailButtonLabel}
                  data-attempt-number={pendingEmailAttemptNumber}
                  onclick={handleSendEmail}
                  disabled={isNavigatingToEmail}
                ></lightning-button>
              </div>
            </div>
          </div>
        </template>

        <!-- Attempt Cards Grid -->
        <div class="attempts-grid">
          <template for:each={attemptsWithProps} for:item="attempt">
            <div key={attempt.attemptNumber} class={attempt.cardClass}>
              <!-- Card Header -->
              <div class="card-header slds-var-m-bottom_small">
                <h3 class="slds-text-heading_small">
                  {attempt.completionIcon} {attempt.currentIcon}
                  {attempt.pendingIcon} {attempt.attemptLabel}
                </h3>
                <p class="slds-text-body_small slds-text-color_weak">
                  {attempt.dayLabel}
                </p>
              </div>

              <!-- Completed Card (Read-Only) -->
              <template if:true={attempt.showReadOnly}>
                <div class="card-content">
                  <div class="slds-form-element slds-var-m-bottom_x-small">
                    <label class="slds-form-element__label slds-text-body_small"
                      >Status</label
                    >
                    <p class="slds-text-body_regular">
                      <lightning-icon
                        icon-name="utility:success"
                        size="x-small"
                        variant="success"
                        class="slds-var-m-right_xx-small"
                      ></lightning-icon>
                      {attempt.statusLabel}
                    </p>
                  </div>

                  <template
                    if:true={attempt.taskRecord}
                  >
                    <template
                      if:true={attempt.taskRecord.Succession_Contact_Established__c}
                    >
                    <div class="slds-form-element slds-var-m-bottom_x-small">
                      <p class="succession-text-color-success">
                        <lightning-icon
                          icon-name="utility:check"
                          size="x-small"
                          class="slds-var-m-right_xx-small"
                        ></lightning-icon>
                        Contact Established
                      </p>
                    </div>
                    </template>
                  </template>

                  <template if:true={attempt.taskNotes}>
                    <div class="slds-form-element">
                      <label
                        class="slds-form-element__label slds-text-body_small"
                        >Notes</label
                      >
                      <div
                        class="notes-display slds-box slds-box_x-small slds-var-p-around_small"
                      >
                        <p class="slds-text-body_small">{attempt.taskNotes}</p>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Locked Card - Task exists but date hasn't arrived -->
              <template if:true={attempt.isLocked}>
                <div class="card-content card-locked">
                  <p
                    class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small"
                  >
                    Scheduled: {attempt.dueDate}
                  </p>
                  <div
                    class="slds-notify slds-notify_alert slds-alert_warning slds-var-m-bottom_small"
                    role="alert"
                  >
                    <lightning-icon
                      icon-name="utility:lock"
                      size="x-small"
                      class="slds-var-m-right_xx-small"
                    ></lightning-icon>
                    <span class="slds-text-body_small"
                      >{attempt.countdownText}</span
                    >
                  </div>
                  <p class="slds-text-body_small slds-text-color_weak">
                    This task cannot be completed until the scheduled date
                    arrives.
                  </p>
                </div>
              </template>

              <!-- Current Card (Editable) - Date has arrived -->
              <template if:true={attempt.isCurrent}>
                <template if:false={attempt.showEditForm}>
                  <!-- Not editing - show Record Outcome button -->
                  <div class="card-content">
                    <p
                      class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small"
                    >
                      Due: {attempt.dueDate}
                    </p>
                    <template if:true={attempt.taskRecord}>
                      <lightning-button
                        variant="brand"
                        label="Record Outcome"
                        data-task-id={attempt.taskRecord.Id}
                        data-attempt-number={attempt.attemptNumber}
                        onclick={handleEdit}
                        class="slds-var-m-top_small"
                      >
                      </lightning-button>
                    </template>
                  </div>
                </template>

                <template if:true={attempt.showEditForm}>
                  <!-- Editing - show inline form (center-aligned) -->
                  <div class="card-content slds-text-align_center">
                    <!-- Question Header -->
                    <div class="slds-var-m-bottom_small">
                      <p class="slds-text-heading_small slds-var-m-bottom_x-small">
                        Was contact made with potential successor?
                      </p>
                    </div>

                    <!-- Radio Buttons (Yes/No) -->
                    <div class="slds-form-element slds-var-m-bottom_medium">
                      <lightning-radio-group
                        name="contactMade"
                        options={contactMadeOptions}
                        value={contactMadeValue}
                        onchange={handleContactMadeChange}
                        type="button"
                      >
                      </lightning-radio-group>
                    </div>

                    <!-- Notes Text Area -->
                    <div class="slds-form-element slds-var-m-bottom_medium">
                      <label
                        class="slds-form-element__label slds-text-align_center"
                      >
                        Agent Notes
                      </label>
                      <div class="slds-form-element__control">
                        <lightning-textarea
                          value={notes}
                          onchange={handleNotesChange}
                          placeholder="Enter your notes about this contact attempt..."
                          class="slds-align_absolute-center"
                        >
                        </lightning-textarea>
                      </div>
                    </div>

                    <!-- Action Buttons (Centered) -->
                    <div
                      class="slds-grid slds-grid_align-center slds-gutters_small"
                    >
                      <div class="slds-col">
                        <lightning-button
                          variant="neutral"
                          label="Cancel"
                          onclick={handleCancel}
                          class="slds-var-m-right_small"
                        >
                        </lightning-button>
                      </div>
                      <div class="slds-col">
                        <template if:true={attempt.taskRecord}>
                          <lightning-button
                            variant="brand"
                            label="Save Outcome"
                            data-task-id={attempt.taskRecord.Id}
                            onclick={handleSaveOutcome}
                          >
                          </lightning-button>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>
              </template>

              <!-- Pending Card - Waiting for previous attempts -->
              <template if:true={attempt.showDisabled}>
                <div class="card-content card-disabled">
                  <p
                    class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small"
                  >
                    Expected: {attempt.dayLabel}
                  </p>
                  <lightning-icon
                    icon-name="utility:clock"
                    size="x-small"
                    class="slds-var-m-right_xx-small"
                  ></lightning-icon>
                  <span class="slds-text-body_small slds-text-color_weak"
                    >{attempt.countdownText}</span
                  >
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>
  </lightning-card>
</template>
