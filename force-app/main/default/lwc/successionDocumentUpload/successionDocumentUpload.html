<template>
    <div class="slds-box">
        <h2 class="slds-text-heading_small slds-m-bottom_medium">Upload Required Documents</h2>

        <p class="slds-m-bottom_medium">
            {uploadInstructions}
        </p>

        <!-- Required Documents Checklist -->
        <div class="slds-box slds-theme_shade slds-m-bottom_large">
            <h3 class="slds-text-heading_x-small slds-m-bottom_small">Required Documents:</h3>
            <ul class="slds-list_ordered slds-m-left_large">
                <template for:each={requiredDocuments} for:item="doc">
                    <li key={doc} class="slds-m-bottom_x-small">{doc}</li>
                </template>
            </ul>
        </div>

        <!-- File Upload Component -->
        <div class="slds-form-element slds-m-bottom_large">
            <lightning-file-upload
                label={uploadLabel}
                name="successionDocuments"
                accept={acceptedFormats}
                multiple
                onuploadfinished={handleUploadFinished}>
            </lightning-file-upload>
        </div>

        <!-- Uploaded Files List -->
        <template if:true={uploadedFiles.length}>
            <div class="slds-box slds-m-bottom_medium">
                <h3 class="slds-text-heading_x-small slds-m-bottom_small">Uploaded Files ({uploadedFiles.length}):</h3>
                <ul class="slds-has-dividers_top-space">
                    <template for:each={uploadedFiles} for:item="file">
                        <li key={file.documentId} class="slds-item slds-p-vertical_x-small">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <div class="slds-col slds-has-flexi-truncate">
                                    <lightning-icon icon-name="doctype:attachment" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="slds-truncate">{file.name}</span>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        variant="bare"
                                        alternative-text="Remove"
                                        title="Remove this file"
                                        data-fileid={file.documentId}
                                        onclick={handleRemoveFile}>
                                    </lightning-button-icon>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
        </template>

        <!-- Upload Guidelines -->
        <div class="slds-box slds-theme_info slds-m-top_large">
            <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_small"></lightning-icon>
            <p class="slds-text-body_small">
                <strong>Document Guidelines:</strong> All documents must be clear and legible. Certifications and
                notarizations should be visible. If you're unable to upload a document, you may submit it via email
                to <a href="mailto:documents@schwabcharitable.org">documents@schwabcharitable.org</a> referencing your case number.
            </p>
        </div>

        <!-- Optional Note -->
        <div class="slds-box slds-theme_shade slds-m-top_medium">
            <p class="slds-text-body_small slds-text-color_weak">
                <strong>Note:</strong> Document upload is optional at this stage. You may proceed without uploading
                and submit documents separately. However, uploading now will expedite processing.
            </p>
        </div>
    </div>
</template>
