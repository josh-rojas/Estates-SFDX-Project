name: Feature Branch CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'force-app/**'
      - 'datasets/**'
      - 'cumulusci.yml'
      - '.github/workflows/**'
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

jobs:
  validate-and-test:
    name: Validate & Test Succession Components
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CumulusCI
        run: |
          pip install cumulusci
          cci version

      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.DEVHUB_AUTH_URL }}
        run: |
          echo "${SFDX_AUTH_URL}" > devhub_auth
          cci org import devhub devhub_auth --global-org
          rm devhub_auth

      - name: Create scratch org
        run: |
          cci org scratch dev feature-ci --default

      - name: Deploy and test
        run: |
          cci flow run ci_succession_feature --org feature-ci

      - name: Delete scratch org
        if: always()
        run: |
          cci org scratch_delete feature-ci || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_results.json
            robot_results/
          retention-days: 30

  code-quality:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version

      - name: Run PMD Static Analysis
        run: |
          sf scanner run \
            --target "force-app/main/default/classes/**/*.cls" \
            --category "Security,Performance,Error Prone" \
            --format sarif \
            --outfile pmd-results.sarif || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-results.sarif

      - name: Check code coverage threshold
        run: |
          echo "✅ Code coverage will be validated in deployment step"
