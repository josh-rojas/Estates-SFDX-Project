name: Release Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - production
          - uat
          - staging

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release_notes
        run: |
          echo "## 🚀 Succession Management Release" > release_notes.md
          echo "" >> release_notes.md
          echo "### Changes in this release:" >> release_notes.md
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> release_notes.md || echo "- Initial release" >> release_notes.md
          
          cat release_notes.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Succession Management ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false

  deploy-production:
    name: Deploy to Production
    needs: create-release
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CumulusCI
        run: |
          pip install cumulusci
          cci version

      - name: Authenticate to Production
        env:
          PROD_AUTH_URL: ${{ secrets.PROD_AUTH_URL }}
        run: |
          echo "${PROD_AUTH_URL}" > prod_auth
          cci org import production prod_auth --global-org
          rm prod_auth

      - name: Validate deployment (check-only)
        run: |
          cci task run deploy \
            --org production \
            --path force-app/main/default \
            --check-only

      - name: Request approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ secrets.PROD_APPROVERS }}
          minimum-approvals: 2
          issue-title: "Production Deployment Approval - ${{ github.ref_name }}"

      - name: Deploy to production
        run: |
          cci flow run deploy_succession_no_data --org production

      - name: Run production tests
        run: |
          cci task run run_tests \
            --org production \
            --test-name-match "%_TEST" \
            --required-org-code-coverage-percent 75

      - name: Assign permission sets
        run: |
          cci task run assign_permission_sets \
            --org production \
            --api-names "Succession_Management_Access,Succession_Field_Access"

      - name: Create deployment artifact
        run: |
          echo "Deployment completed successfully" > deployment.log
          echo "Version: ${{ github.ref_name }}" >> deployment.log
          echo "Commit: ${{ github.sha }}" >> deployment.log
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> deployment.log

      - name: Upload deployment artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./deployment.log
          asset_name: production-deployment-${{ github.ref_name }}.log
          asset_content_type: text/plain

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production deployment completed successfully"
          echo "Version: ${{ github.ref_name }}"
          echo "Org: production"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed - manual rollback may be required"
          # Add rollback logic here if needed

  deploy-uat:
    name: Deploy to UAT
    if: github.event.inputs.environment == 'uat'
    runs-on: ubuntu-latest
    environment: uat
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CumulusCI
        run: |
          pip install cumulusci
          cci version

      - name: Authenticate to UAT
        env:
          UAT_AUTH_URL: ${{ secrets.UAT_AUTH_URL }}
        run: |
          echo "${UAT_AUTH_URL}" > uat_auth
          cci org import uat uat_auth --global-org
          rm uat_auth

      - name: Deploy to UAT
        run: |
          cci flow run deploy_succession --org uat

      - name: Run UAT tests
        run: |
          cci task run run_tests \
            --org uat \
            --required-org-code-coverage-percent 75
